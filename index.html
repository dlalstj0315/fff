<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ROOM CHAT - MINI GAMES</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#080c17;
 color:white;
 font-family:Arial,"Noto Sans KR",sans-serif;
}

button,input{
 font:inherit;
}

button{
 cursor:pointer;
 touch-action:manipulation;
}

input{
 -webkit-appearance:none;
}

.hidden{
 display:none!important;
}

/* ================= START ================= */

#start{
 width:100%;
 height:100dvh;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 background:
 radial-gradient(circle at 10% 10%,#3d4fa0 0,transparent 35%),
 radial-gradient(circle at 90% 90%,#6d327f 0,transparent 35%),
 #080c17;
}

.card{
 width:min(460px,100%);
 padding:28px;
 border-radius:25px;
 background:#151d33;
 border:1px solid #303b58;
 box-shadow:0 30px 90px #0009;
}

.logo{
 text-align:center;
 font-size:36px;
 font-weight:900;
 letter-spacing:2px;
}

.sub{
 text-align:center;
 color:#8b97b5;
 margin:8px 0 25px;
 font-size:14px;
}

label{
 display:block;
 color:#aeb8ce;
 font-size:13px;
 margin:13px 0 7px;
}

.input{
 width:100%;
 height:50px;
 padding:0 14px;
 border:1px solid #36415e;
 border-radius:12px;
 outline:none;
 background:#10172a;
 color:white;
}

.input:focus{
 border-color:#7187ff;
}

.primary{
 width:100%;
 height:50px;
 margin-top:13px;
 border:0;
 border-radius:12px;
 background:linear-gradient(135deg,#5d7cff,#8759e9);
 color:white;
 font-weight:900;
}

.divider{
 display:flex;
 align-items:center;
 gap:10px;
 color:#606c88;
 margin:21px 0;
 font-size:12px;
}

.divider:before,
.divider:after{
 content:"";
 height:1px;
 flex:1;
 background:#303950;
}

.codeInput{
 text-align:center;
 font-size:20px;
 font-weight:900;
 letter-spacing:7px;
}

#error{
 min-height:20px;
 text-align:center;
 color:#ff7188;
 font-size:13px;
 margin-top:10px;
}

/* ================= APP ================= */

#app{
 width:100%;
 height:100dvh;
 min-height:100vh;
 display:grid;
 grid-template-columns:240px 1fr;
 background:#090e1b;
}

.sidebar{
 display:flex;
 flex-direction:column;
 background:#101629;
 border-right:1px solid #252e46;
 min-height:0;
}

.roomInfo{
 padding:18px;
 border-bottom:1px solid #252e46;
}

.roomName{
 font-weight:900;
 font-size:17px;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}

.code{
 margin-top:10px;
 padding:10px;
 text-align:center;
 background:#202a48;
 border-radius:9px;
 color:#a7b5ff;
 font-size:18px;
 font-weight:900;
 letter-spacing:5px;
}

.copy{
 width:100%;
 height:38px;
 margin-top:8px;
 border:1px solid #35405e;
 border-radius:9px;
 background:#171f35;
 color:#d1d9ec;
}

.peopleTitle{
 padding:16px 17px 7px;
 color:#7e8ba8;
 font-size:12px;
 font-weight:900;
}

.users{
 flex:1;
 min-height:0;
 overflow-y:auto;
 padding:0 9px;
}

.user{
 display:flex;
 align-items:center;
 gap:9px;
 padding:9px;
 border-radius:10px;
}

.avatar{
 width:34px;
 height:34px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 background:linear-gradient(135deg,#607cff,#925be9);
 font-weight:900;
 font-size:12px;
}

.uname{
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
 font-size:14px;
}

.host{
 color:#ffd463;
 font-size:10px;
 margin-left:5px;
}

.sideButtons{
 padding:10px;
}

.sideButton{
 width:100%;
 height:42px;
 margin-top:7px;
 border:1px solid #303b58;
 border-radius:10px;
 background:#171f35;
 color:#d4dcee;
}

.leave{
 color:#ff8a9d;
}

/* ================= CHAT ================= */

.main{
 min-width:0;
 min-height:0;
 display:flex;
 flex-direction:column;
}

.header{
 height:62px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 18px;
 background:#0e1425;
 border-bottom:1px solid #252e46;
}

.headerTitle{
 font-weight:900;
}

.status{
 color:#8490aa;
 font-size:11px;
}

.dot{
 display:inline-block;
 width:8px;
 height:8px;
 border-radius:50%;
 background:#3de38b;
 box-shadow:0 0 8px #3de38b;
 margin-right:5px;
}

.messages{
 flex:1;
 min-height:0;
 overflow-y:auto;
 padding:18px;
 overscroll-behavior:contain;
}

.message{
 display:flex;
 margin-bottom:14px;
}

.message.mine{
 justify-content:flex-end;
}

.msgContent{
 max-width:min(70%,650px);
}

.msgTop{
 display:flex;
 gap:8px;
 margin-bottom:4px;
 font-size:11px;
 color:#aeb8ce;
}

.message.mine .msgTop{
 justify-content:flex-end;
}

.time{
 color:#59657e;
 font-size:9px;
}

.bubble{
 padding:10px 13px;
 border-radius:13px;
 background:#19223a;
 line-height:1.45;
 word-break:break-word;
}

.mine .bubble{
 background:linear-gradient(135deg,#5975e7,#7658d8);
}

.system{
 text-align:center;
 color:#69758e;
 font-size:11px;
 margin:12px;
}

.system span{
 display:inline-block;
 padding:6px 10px;
 border-radius:20px;
 background:#121a2d;
}

.chatInputArea{
 flex:none;
 padding:10px 14px;
 padding-bottom:max(10px,env(safe-area-inset-bottom));
 background:#0e1425;
 border-top:1px solid #252e46;
}

.form{
 display:flex;
 gap:7px;
}

.chatInput{
 flex:1;
 min-width:0;
 height:46px;
 padding:0 12px;
 border:1px solid #303b56;
 border-radius:12px;
 outline:none;
 background:#141c31;
 color:white;
}

.send{
 width:62px;
 flex:none;
 border:0;
 border-radius:12px;
 background:#607af4;
 color:white;
 font-weight:900;
}

/* ================= GAME ================= */

#gamePanel{
 position:fixed;
 inset:0;
 z-index:50;
 display:flex;
 flex-direction:column;
 width:100%;
 height:100dvh;
 min-height:100vh;
 background:#080c17;
}

.gameHeader{
 height:60px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 background:#11182b;
 border-bottom:1px solid #303a56;
}

.gameTitle{
 font-size:18px;
 font-weight:900;
}

.closeGame{
 min-height:40px;
 padding:0 13px;
 border:1px solid #3a4562;
 border-radius:9px;
 background:#202943;
 color:white;
}

.gameBody{
 flex:1;
 min-height:0;
 overflow-y:auto;
 overflow-x:hidden;
 padding:18px;
 overscroll-behavior:contain;
}

.gameMenu{
 width:min(900px,100%);
 margin:auto;
}

.gameIntro{
 text-align:center;
 margin-bottom:18px;
}

.gameIntro h1{
 margin:4px 0 7px;
 font-size:29px;
}

.gameIntro p{
 margin:0;
 color:#8995b2;
 font-size:13px;
}

.gameGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:11px;
}

.gameCard{
 min-height:125px;
 padding:16px;
 border:1px solid #303b58;
 border-radius:16px;
 background:#131b30;
 color:white;
 text-align:left;
}

.gameCard:active{
 transform:scale(.98);
}

.gameIcon{
 font-size:30px;
}

.gameCard b{
 display:block;
 margin-top:9px;
}

.gameCard span{
 display:block;
 margin-top:5px;
 color:#7f8ba7;
 font-size:11px;
}

.modeBox{
 margin:19px 0;
 text-align:center;
}

.modeBtn{
 min-height:42px;
 padding:0 18px;
 margin:4px;
 border:1px solid #35405d;
 border-radius:10px;
 background:#151e34;
 color:#cbd3e8;
}

.modeBtn.selected{
 background:#607af4;
 border-color:#8497ff;
 color:white;
}

.startGame{
 display:block;
 min-height:47px;
 padding:0 28px;
 margin:17px auto 0;
 border:0;
 border-radius:12px;
 background:linear-gradient(135deg,#5b7cff,#895cff);
 color:white;
 font-weight:900;
}

.wait{
 text-align:center;
 color:#8d99b5;
 margin-top:11px;
 font-size:12px;
}

.playArea{
 width:min(900px,100%);
 margin:auto;
 text-align:center;
}

.playArea h2{
 font-size:26px;
 margin:4px 0 8px;
}

.playInfo{
 color:#8e9ab7;
 font-size:13px;
 margin-bottom:16px;
}

.gameBoard{
 position:relative;
 width:100%;
 height:min(55vh,430px);
 min-height:300px;
 border-radius:20px;
 background:#111a2d;
 border:1px solid #303b58;
 overflow:hidden;
 touch-action:none;
}

.reactionBoard{
 width:100%;
 height:100%;
 border:0;
 border-radius:19px;
 background:#d73848;
 color:white;
 font-size:29px;
 font-weight:900;
 touch-action:none;
 user-select:none;
}

.reactionBoard.green{
 background:#21b86a;
}

.reactionBoard.false{
 background:#742937;
}

.target{
 position:absolute;
 width:72px;
 height:72px;
 border-radius:50%;
 border:5px solid white;
 background:#ff536e;
 box-shadow:0 0 20px #ff536e;
 transform:translate(-50%,-50%);
 touch-action:none;
}

.numberBox{
 padding:28px 12px;
 margin:18px 0;
 border-radius:18px;
 background:#161f35;
 font-size:60px;
 font-weight:900;
 letter-spacing:8px;
}

.answerInput{
 width:min(300px,100%);
 height:48px;
 padding:0 12px;
 border:1px solid #38435f;
 border-radius:11px;
 outline:none;
 background:#10172a;
 color:white;
 text-align:center;
}

.actionBtn{
 min-height:44px;
 padding:0 20px;
 margin:7px;
 border:0;
 border-radius:10px;
 background:#617af5;
 color:white;
 font-weight:900;
}

.colorChoices{
 display:flex;
 justify-content:center;
 gap:9px;
 flex-wrap:wrap;
 margin:20px;
}

.colorChoice{
 width:100px;
 height:58px;
 border:3px solid white;
 border-radius:12px;
 color:white;
 font-weight:900;
}

.sequenceGrid{
 display:grid;
 grid-template-columns:repeat(3,minmax(65px,90px));
 gap:10px;
 justify-content:center;
 margin:20px;
}

.seqBtn{
 width:100%;
 height:70px;
 border:0;
 border-radius:12px;
 background:#273451;
 color:white;
 font-size:20px;
 font-weight:900;
 touch-action:manipulation;
}

.result{
 width:min(600px,100%);
 margin:18px auto;
 padding:19px;
 border:1px solid #34405e;
 border-radius:17px;
 background:#131c31;
}

.result h2{
 margin-top:0;
}

.resultRow{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:11px 5px;
 border-bottom:1px solid #27324b;
}

.winner{
 color:#ffd35e;
 font-weight:900;
}

.small{
 color:#7e8aa5;
 font-size:11px;
 line-height:1.7;
}

/* ================= MODAL ================= */

#codeModal{
 position:fixed;
 inset:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:#000b;
}

.modal{
 width:min(390px,100%);
 padding:28px 20px;
 text-align:center;
 border-radius:22px;
 background:#151d33;
 border:1px solid #35405c;
}

.bigCode{
 margin:17px 0;
 font-size:40px;
 font-weight:900;
 letter-spacing:8px;
 color:#9eb0ff;
}

.modal button{
 min-height:42px;
 padding:0 15px;
 border:0;
 border-radius:10px;
 background:#6079f4;
 color:white;
}

/* ================= MOBILE ================= */

@media(max-width:750px){

 #app{
  display:block;
 }

 .sidebar{
  display:none;
 }

 .header{
  height:56px;
  padding:0 13px;
 }

 .messages{
  padding:13px;
 }

 .msgContent{
  max-width:84%;
 }

 .chatInputArea{
  padding:8px 9px;
  padding-bottom:max(8px,env(safe-area-inset-bottom));
 }

 .chatInput{
  height:45px;
 }

 .send{
  width:58px;
 }

 .gameHeader{
  height:56px;
  padding:0 10px;
 }

 .gameBody{
  padding:12px;
 }

 .gameGrid{
  grid-template-columns:repeat(2,1fr);
  gap:9px;
 }

 .gameCard{
  min-height:115px;
  padding:13px;
 }

 .gameIcon{
  font-size:27px;
 }

 .gameBoard{
  height:calc(100dvh - 190px);
  min-height:300px;
  max-height:520px;
 }

 .reactionBoard{
  font-size:25px;
 }

 .target{
  width:75px;
  height:75px;
 }

 .numberBox{
  font-size:42px;
  letter-spacing:5px;
 }

 .colorChoice{
  width:45%;
  max-width:145px;
 }

 .sequenceGrid{
  grid-template-columns:repeat(3,80px);
  gap:8px;
 }

 .seqBtn{
  height:65px;
 }

}

@media(max-width:430px){

 .card{
  padding:22px 18px;
 }

 .logo{
  font-size:30px;
 }

 .gameGrid{
  grid-template-columns:1fr 1fr;
 }

 .gameCard{
  min-height:105px;
  padding:11px;
 }

 .gameCard b{
  font-size:14px;
 }

 .gameCard span{
  font-size:10px;
 }

 .gameIcon{
  font-size:25px;
 }

 .playArea h2{
  font-size:23px;
 }

 .sequenceGrid{
  grid-template-columns:repeat(3,1fr);
  max-width:280px;
  margin:18px auto;
 }

 .seqBtn{
  width:100%;
  height:62px;
 }

}

/* 가로 모바일 */

@media(max-height:500px) and (orientation:landscape){

 .gameHeader{
  height:48px;
 }

 .gameBody{
  padding:8px;
 }

 .gameBoard{
  height:calc(100dvh - 110px);
  min-height:250px;
 }

 .gameIntro{
  margin-bottom:8px;
 }

 .gameIntro h1{
  font-size:22px;
 }

 .gameCard{
  min-height:90px;
 }

}
</style>
</head>

<body>

<!-- ================= START ================= -->

<div id="start">

 <div class="card">

  <div class="logo">ROOM CHAT</div>

  <div class="sub">
   친구들과 채팅하고 미니게임을 즐겨보세요
  </div>

  <label>닉네임</label>

  <input
   id="name"
   class="input"
   maxlength="20"
   autocomplete="nickname"
   placeholder="닉네임"
  >

  <button id="create" class="primary">
   새 방 만들기
  </button>

  <div class="divider">또는</div>

  <label>6자리 방 코드</label>

  <input
   id="joinCode"
   class="input codeInput"
   maxlength="6"
   inputmode="numeric"
   autocomplete="off"
   placeholder="000000"
  >

  <button id="join" class="primary">
   방 들어가기
  </button>

  <div id="error"></div>

 </div>

</div>


<!-- ================= APP ================= -->

<div id="app" class="hidden">

 <aside class="sidebar">

  <div class="roomInfo">

   <div id="roomName" class="roomName">
    채팅방
   </div>

   <div id="roomCode" class="code">
    000000
   </div>

   <button id="copyCode" class="copy">
    방 코드 복사
   </button>

  </div>

  <div class="peopleTitle">
   접속자
  </div>

  <div id="users" class="users"></div>

  <div class="sideButtons">

   <button id="miniButton" class="sideButton">
    🎮 미니게임
   </button>

   <button id="leave" class="sideButton leave">
    방 나가기
   </button>

  </div>

 </aside>


 <main class="main">

  <header class="header">

   <div id="headerName" class="headerTitle">
    채팅방
   </div>

   <div class="status">
    <span class="dot"></span>
    실시간
   </div>

  </header>


  <div id="messages" class="messages"></div>


  <div class="chatInputArea">

   <form id="chatForm" class="form">

    <input
     id="chatInput"
     class="chatInput"
     maxlength="500"
     autocomplete="off"
     placeholder="메시지를 입력하세요..."
    >

    <button class="send">
     전송
    </button>

   </form>

  </div>

 </main>

</div>


<!-- ================= ROOM CODE ================= -->

<div id="codeModal" class="hidden">

 <div class="modal">

  <div>
   친구에게 이 방 코드를 알려주세요
  </div>

  <div id="bigCode" class="bigCode">
   000000
  </div>

  <button id="modalCopy">
   코드 복사
  </button>

  <button
   id="modalClose"
   style="background:#29334e;margin-left:5px"
  >
   입장하기
  </button>

 </div>

</div>


<!-- ================= GAME ================= -->

<div id="gamePanel" class="hidden">

 <header class="gameHeader">

  <div class="gameTitle">
   🎮 미니게임
  </div>

  <button id="closeGame" class="closeGame">
   채팅으로
  </button>

 </header>

 <div id="gameBody" class="gameBody"></div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let peer=null;
let myId="";
let myName="";
let roomCode="";
let roomTitle="";
let host=false;

let connections=new Map();

let selectedMode="solo";

let game={
 type:null,
 mode:"solo",
 running:false,
 round:0,
 state:{},
 scores:{},
 results:[]
};

let localSequence=[];

const $=id=>document.getElementById(id);


/* =====================================================
   HELPERS
===================================================== */

function clean(v,max){
 return String(v||"")
  .replace(/[<>]/g,"")
  .trim()
  .slice(0,max);
}

function error(t){
 $("error").textContent=t;
}

function toast(t){

 const old=document.getElementById("toast");

 if(old)old.remove();

 const x=document.createElement("div");

 x.id="toast";
 x.textContent=t;

 Object.assign(x.style,{
  position:"fixed",
  left:"50%",
  bottom:"75px",
  transform:"translateX(-50%)",
  padding:"11px 17px",
  borderRadius:"11px",
  background:"#202a43",
  border:"1px solid #3b4765",
  zIndex:9999,
  color:"#fff",
  fontSize:"13px"
 });

 document.body.appendChild(x);

 setTimeout(()=>x.remove(),1800);
}

function escapeHTML(s){

 return String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function time(t){

 return new Date(t).toLocaleTimeString(
  "ko-KR",
  {
   hour:"2-digit",
   minute:"2-digit"
  }
 );
}


/* =====================================================
   CHAT
===================================================== */

function system(t){

 const d=document.createElement("div");
 d.className="system";

 const s=document.createElement("span");
 s.textContent=t;

 d.appendChild(s);

 $("messages").appendChild(d);

 $("messages").scrollTop=
  $("messages").scrollHeight;
}

function message(data){

 const mine=data.senderId===myId;

 const d=document.createElement("div");

 d.className=
  "message"+(mine?" mine":"");

 const c=document.createElement("div");
 c.className="msgContent";

 const top=document.createElement("div");
 top.className="msgTop";

 const n=document.createElement("span");
 n.textContent=mine?"나":data.name;

 const tm=document.createElement("span");
 tm.className="time";
 tm.textContent=time(data.time);

 top.appendChild(n);
 top.appendChild(tm);

 const b=document.createElement("div");
 b.className="bubble";
 b.textContent=data.text;

 c.appendChild(top);
 c.appendChild(b);

 d.appendChild(c);

 $("messages").appendChild(d);

 $("messages").scrollTop=
  $("messages").scrollHeight;
}


/* =====================================================
   USERS
===================================================== */

function allUsers(){

 const arr=[
  {
   id:myId,
   name:myName,
   host:host
  }
 ];

 connections.forEach(x=>{

  if(
   x.user &&
   !arr.some(u=>u.id===x.user.id)
  ){
   arr.push(x.user);
  }

 });

 return arr.slice(0,5);
}

function drawUsers(){

 const box=$("users");

 box.innerHTML="";

 allUsers().forEach(u=>{

  const d=document.createElement("div");
  d.className="user";

  const a=document.createElement("div");
  a.className="avatar";
  a.textContent=
   u.name.charAt(0).toUpperCase();

  const n=document.createElement("div");
  n.className="uname";
  n.textContent=u.name;

  if(u.host){

   const h=document.createElement("span");

   h.className="host";
   h.textContent="방장";

   n.appendChild(h);
  }

  d.appendChild(a);
  d.appendChild(n);

  box.appendChild(d);
 });

/* =====================================================
   NETWORK
===================================================== */

function connect(conn){

 const item={
  conn:conn,
  user:null
 };

 connections.set(
  conn.peer,
  item
 );

 conn.on("open",()=>{

  conn.send({
   type:"hello",
   user:{
    id:myId,
    name:myName,
    host:host
   }
  });

  if(host){
   sendFullState(conn);
  }
 });

 conn.on("data",data=>{
  receive(conn,data);
 });

 conn.on("close",()=>{

  const old=connections.get(conn.peer);

  const name=
   old?.user?.name;

  connections.delete(conn.peer);

  drawUsers();

  if(name){
   system(name+"님이 나갔습니다.");
  }
 });

 conn.on("error",()=>{
  connections.delete(conn.peer);
  drawUsers();
 });
}

function broadcast(data,except=null){

 connections.forEach(x=>{

  if(
   x.conn &&
   x.conn.open &&
   x.conn.peer!==except
  ){

   try{
    x.conn.send(data);
   }catch(e){}
  }

 });
}

function sendFullState(conn){

 conn.send({
  type:"fullUsers",
  users:allUsers()
 });

 if(game.running){

  conn.send({
   type:"gameState",
   game:game
  });

 }
}

function receive(conn,data){

 if(!data)return;


 if(data.type==="hello"){

  const item=
   connections.get(conn.peer);

  if(item){
   item.user=data.user;
  }

  drawUsers();

  if(host){
   sendFullState(conn);
  }

  return;
 }


 if(data.type==="fullUsers"){

  data.users.forEach(u=>{

   if(u.id===myId)return;

   const x=
    connections.get(u.id);

   if(x){
    x.user=u;
   }

  });

  drawUsers();

  return;
 }


 if(data.type==="chat"){

  message(data);

  if(host){
   broadcast(data,conn.peer);
  }

  return;
 }


 if(data.type==="gameCommand"){

  if(host){

   processGameCommand(
    data.command,
    data.payload,
    conn.peer
   );

  }

  return;
 }


 if(data.type==="gameState"){

  game=data.game;

  renderGameState();

  return;
 }


 if(data.type==="gameInvite"){

  game=data.game;

  openGame();

  renderGameState();

  return;
 }

}

/* =====================================================
   PROCESS
===================================================== */

function processGameCommand(
 command,
 payload,
 sender
){

 if(!host)return;

 if(command==="reactionClick"){
  reactionClick(sender);
 }

 if(command==="targetClick"){
  targetClick(sender);
 }

 if(command==="memoryAnswer"){
  memoryAnswer(sender,payload);
 }

 if(command==="mathAnswer"){
  mathAnswer(sender,payload);
 }

 if(command==="colorAnswer"){
  colorAnswer(sender,payload);
 }

 if(command==="sequenceAnswer"){
  sequenceAnswer(sender,payload);
 }

}


/* =====================================================

function beginRound(){

 if(!game.running)return;

 localSequence=[];

 if(game.type==="reaction")
  beginReaction();

 if(game.type==="target")
  beginTarget();

 if(game.type==="memory")
  beginMemory();

 if(game.type==="math")
  beginMath();

 if(game.type==="color")
  beginColor();

 if(game.type==="sequence")
  beginSequence();

 gameBroadcast();
 renderGameState();
}


/* =====================================================
   REACTION
===================================================== */

function beginReaction(){

 const greenAt=
  Date.now()+
  1800+
  Math.random()*3500;

 game.state={
  phase:"red",
  greenAt:greenAt,
  clicks:{}
 };

 gameBroadcast();
 renderGameState();

 setTimeout(()=>{

  if(
   game.running &&
   game.state.phase==="red"
  ){

   game.state.phase="green";
   game.state.greenAt=Date.now();

   gameBroadcast();
   renderGameState();

  }

 },greenAt-Date.now());

}

function reactionClick(id){

 if(!game.scores[id])return;

 if(game.state.phase==="red"){

  if(game.state.clicks[id])return;

  game.state.clicks[id]=9999;

  game.scores[id]
   .times.push(9999);

  game.state.phase="false";

  gameBroadcast();
  renderGameState();

  setTimeout(nextRound,1200);

  return;
 }

 if(game.state.phase!=="green")return;

 if(game.state.clicks[id])return;

 const ms=
  Date.now()-
  game.state.greenAt;

 game.state.clicks[id]=ms;

 game.scores[id]
  .times.push(ms);

 game.scores[id].score++;

 if(
  Object.keys(game.state.clicks).length>=
  allUsers().length
 ){

  setTimeout(nextRound,900);

 }else{

  gameBroadcast();
  renderGameState();

 }

}

   }

  },300);

/* =====================================================
   SEQUENCE
===================================================== */

function beginSequence(){

 const length=
  Math.min(
   3+game.round,
   7
  );

 const seq=[];

 for(
  let i=0;
  i<length;
  i++
 ){

  seq.push(
   Math.floor(
    Math.random()*9
   )
  );

 }

 game.state={
  sequence:seq,
  phase:"show",
  showIndex:-1,
  answered:{}
 };

 gameBroadcast();
 renderGameState();

 let index=-1;

 const timer=
  setInterval(()=>{

   index++;

   game.state.showIndex=index;

   if(index>=seq.length){

    clearInterval(timer);

    game.state.phase="input";
    game.state.showIndex=-1;

   }

   gameBroadcast();
   renderGameState();

  },550);

}

function sequenceAnswer(id,payload){

 if(
  game.state.answered[id]
 )return;

 game.state.answered[id]=true;

 const answer=
  Array.isArray(payload)
   ?payload.map(Number)
   :[];

 const good=
  JSON.stringify(answer)===
  JSON.stringify(
   game.state.sequence
  );

 if(good){

  game.scores[id].score++;

 }

 gameBroadcast();
 renderGameState();

 if(
  Object.keys(game.state.answered).length>=
  allUsers().length
 ){

  setTimeout(nextRound,900);

 }

}

   NEXT ROUND
===================================================== */

function nextRound(){

 game.round++;

 if(game.round>3){

  finishGame();

 }else{

  beginRound();

 }

}


/* =====================================================
   FINISH
===================================================== */

function finishGame(){

 game.running=false;

 clearInterval(
  window.targetTimer
 );

 game.results=
  Object.entries(game.scores)
   .map(([id,v])=>({
    id:id,
    name:v.name,
    score:v.score,
    times:v.times
   }))
   .sort(
    (a,b)=>b.score-a.score
   );

 gameBroadcast();
 renderGameState();

}

  gameTop(
   "⚡ 순간 반응",
   "초록색으로 바뀌는 순간 화면을 터치하세요."
  )+
 `
  <button
   class="
    reactionBoard
    ${
     phase==="green"
      ?"green"
      :phase==="false"
       ?"false"
       :""
    }
   "
   ontouchstart="gameCommand('reactionClick')"
   onclick="gameCommand('reactionClick')"
  >
   ${text}
  </button>

  <div class="small" style="margin-top:10px">

   ${
    Object.entries(
     game.state.clicks||{}
    )
    .map(([id,ms])=>{

     const s=
      game.scores[id];

     return `
      ${escapeHTML(s?.name||"플레이어")}
      :
      ${
       ms>=9999
        ?"실격"
        :ms+"ms"
      }
      <br>
     `;

    }).join("")
   }

  </div>

 </div>
 `;

}


/* =====================================================
   TARGET RENDER
===================================================== */

function renderTarget(){

 const s=game.state;

 $("gameBody").innerHTML=
  gameTop(
   "🎯 타겟 클릭",
   `남은 시간: ${s.time}초`
  )+
 `
 <div class="gameBoard">

  <button
   class="target"
   style="
    left:${s.target.x}%;
    top:${s.target.y}%;
   "
   ontouchstart="
    event.preventDefault();
    gameCommand('targetClick')
   "
   onclick="gameCommand('targetClick')"
  ></button>

 </div>

 <div class="small">

  ${
   Object.entries(game.scores)
    .map(([id,v])=>
     escapeHTML(v.name)+
     " "+v.score+"회"
    )
    .join(" · ")
  }

 </div>

 </div>
 `;

}


/* =====================================================
   MEMORY RENDER
===================================================== */

function renderMemory(){

 const s=game.state;

 $("gameBody").innerHTML=
  gameTop(
   "🧠 숫자 기억",
   s.visible
    ?"숫자를 기억하세요!"
    :"기억한 숫자를 입력하세요."
  )+
 `
 <div class="numberBox">
  ${
   s.visible
    ?s.number
    :"?????"
  }
 </div>

 ${
  s.visible
   ?""
   :`

    <input
     id="answer"
     class="answerInput"
     maxlength="5"
     inputmode="numeric"
     autocomplete="off"
     placeholder="숫자 입력"
    >

    <br>

    <button
     class="actionBtn"
     onclick="
      gameCommand(
       'memoryAnswer',
       document.getElementById('answer').value
      )
     "
    >
     제출
    </button>
   `
 }

 </div>
 `;

 if(!s.visible){

  const input=
   document.getElementById("answer");

  if(input){
   input.focus();
  }

 }

}


/* =====================================================
   MATH RENDER
===================================================== */

function renderMath(){

 const s=game.state;

 $("gameBody").innerHTML=
  gameTop(
   "🔢 빠른 계산",
   "정답을 최대한 빨리 입력하세요."
  )+
 `
 <div class="numberBox">
  ${s.a} ${s.op} ${s.b} = ?
 </div>

 <input
  id="answer"
  class="answerInput"
  inputmode="numeric"
  autocomplete="off"
  placeholder="정답"
 >

 <br>

 <button
  class="actionBtn"
  onclick="
   gameCommand(
    'mathAnswer',
    document.getElementById('answer').value
   )
  "
 >
  제출
 </button>

 </div>
 `;

 const input=
  document.getElementById("answer");

 if(input){
  input.focus();
 }

}


/* =====================================================
   COLOR RENDER
===================================================== */

function renderColor(){

 const s=game.state;
 const c=colors[s.correct];

 $("gameBody").innerHTML=
  gameTop(
   "🟢 색깔 맞히기",
   "아래 색과 같은 색을 선택하세요."
  )+
 `
 <div
  style="
   margin:22px auto;
   width:min(180px,45vw);
   height:min(130px,30vw);
   border-radius:20px;
   background:${c.value};
   border:4px solid white;
  "
 ></div>

 <div class="colorChoices">

  ${
   colors.map((x,i)=>`

    <button
     class="colorChoice"
     style="background:${x.value}"
     onclick="
      gameCommand(
       'colorAnswer',
       ${i}
      )
     "
    >
     ${x.name}
    </button>

   `).join("")
  }

 </div>

 </div>
 `;

}


/* =====================================================
   SEQUENCE RENDER
===================================================== */

function renderSequence(){

 const s=game.state;

 let html="";

 if(s.phase==="show"){

  let value="●";

  if(
   s.showIndex>=0 &&
   s.showIndex<s.sequence.length
  ){

   value=
    s.sequence[s.showIndex]+1;

  }

  html=`

   <div
    class="numberBox"
    style="font-size:45px"
   >
    ${value}
   </div>

   <p>
    순서를 기억하세요!
   </p>

  `;

 }else{

  html=`

   <p>
    나온 순서대로 버튼을 누르세요.
   </p>

   <div class="sequenceGrid">

    ${
     Array.from(
      {length:9},
      (_,i)=>`

       <button
        class="seqBtn"
        onclick="sequenceLocal(${i})"
       >
        ${i+1}
       </button>

      `
     ).join("")
    }

   </div>

   <div
    id="seqCurrent"
    class="small"
   >
    입력:
   </div>

   <button
    class="actionBtn"
    onclick="sequenceSubmit()"
   >
    제출
   </button>

  `;

 }

 $("gameBody").innerHTML=
  gameTop(
   "🧩 순서 기억",
   "나타난 버튼 순서를 기억하세요."
  )+
  html+
  "</div>";

}

function sequenceLocal(n){

 if(
  localSequence.length>=
  game.state.sequence.length
 )return;

 localSequence.push(n);

 const buttons=
  document.querySelectorAll(".seqBtn");

 const b=
  buttons[n];

 if(b){

  b.classList.add("lit");

  setTimeout(
   ()=>b.classList.remove("lit"),
   130
  );

 }

 const box=
  document.getElementById("seqCurrent");

 if(box){

  box.textContent=
   "입력: "+
   localSequence
    .map(x=>x+1)
    .join(" → ");

 }

}

function sequenceSubmit(){

 const answer=
  [...localSequence];

 localSequence=[];

 gameCommand(
  "sequenceAnswer",
  answer
);


/* =====================================================
   RESULTS
===================================================== */

function renderResults(){

 const rows=
  game.results
   .map((x,i)=>`

    <div class="resultRow">

     <span>
      ${
       i===0
        ?"🏆 "
        :""
      }

      ${i+1}위
      ${escapeHTML(x.name)}
     </span>

     <b>
      ${x.score}점
     </b>

    </div>

   `)
   .join("");

 $("gameBody").innerHTML=`

 <div class="playArea">

  <h2>🏆 게임 결과</h2>

  <div class="result">

   <h2>
    ${
     game.results[0]
      ?escapeHTML(
       game.results[0].name
      )+" 승리!"
      :"게임 종료"
    }
   </h2>

   ${rows}

  </div>

  ${
   host
    ?`

     <button
      class="actionBtn"
      onclick="showMenu()"
     >
      다른 게임 선택
     </button>

    `
    :""
  }

 </div>

 `;

}


/* =====================================================
   RENDER GAME
===================================================== */

function renderGameState(){

 if(
  !game.running &&
  game.results &&
  game.results.length
 ){

  renderResults();
  return;
 }

 if(!game.type){

  showMenu();
  return;
 }

 if(game.type==="reaction")
  renderReaction();

 if(game.type==="target")
  renderTarget();

 if(game.type==="memory")
  renderMemory();

 if(game.type==="math")
  renderMath();

 if(game.type==="color")
  renderColor();

 if(game.type==="sequence")
  renderSequence();

}


/* =====================================================
   MOBILE KEYBOARD ENTER
===================================================== */

document.addEventListener(
 "keydown",
 e=>{

  if(
   e.key==="Enter" &&
   document.activeElement?.id==="answer"
  ){

   if(game.type==="memory"){

    gameCommand(
     "memoryAnswer",
     document.activeElement.value
    );

   }

   if(game.type==="math"){

    gameCommand(
     "mathAnswer",
     document.activeElement.value
    );

   }

  }

 }
);


/* =====================================================
   START ENTER
===================================================== */

$("name").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter"){
   $("create").click();
  }

 }
);

$("joinCode").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter"){
   $("join").click();
  }

 }
);


/* =====================================================
   PREVENT DOUBLE TOUCH ZOOM / LONG PRESS
===================================================== */

document.addEventListener(
 "contextmenu",
 e=>{
  if(
   e.target.closest("#gamePanel")
  ){
   e.preventDefault();
  }
 }
);

document.addEventListener(
 "gesturestart",
 e=>{
  e.preventDefault();
 }
);

</script>

</body>
</html>
