<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ROOM CHAT MINI GAME</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#080c17;
 color:#fff;
 font-family:Arial,"Noto Sans KR",sans-serif;
}
button,input{
 font:inherit;
}
button{
 cursor:pointer;
 touch-action:manipulation;
}
.hidden{display:none!important}

#start{
 width:100%;
 height:100dvh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 background:
 radial-gradient(circle at 10% 10%,#384b9d,transparent 35%),
 radial-gradient(circle at 90% 90%,#713582,transparent 35%),
 #080c17;
}
.card{
 width:min(450px,100%);
 padding:28px;
 border-radius:25px;
 background:#151d33;
 border:1px solid #303b58;
 box-shadow:0 30px 90px #0009;
}
.logo{
 text-align:center;
 font-size:34px;
 font-weight:900;
}
.sub{
 text-align:center;
 color:#8d99b5;
 font-size:13px;
 margin:8px 0 25px;
}
label{
 display:block;
 margin:12px 0 6px;
 color:#aeb8ce;
 font-size:12px;
}
.input{
 width:100%;
 height:50px;
 border:1px solid #36415e;
 border-radius:12px;
 outline:none;
 background:#10172a;
 color:white;
 padding:0 14px;
}
.input:focus{
 border-color:#7187ff;
}
.primary{
 width:100%;
 height:50px;
 margin-top:12px;
 border:0;
 border-radius:12px;
 color:white;
 font-weight:900;
 background:linear-gradient(135deg,#5d7cff,#8759e9);
}
.divider{
 display:flex;
 align-items:center;
 gap:10px;
 color:#59657c;
 margin:20px 0;
 font-size:11px;
}
.divider:before,.divider:after{
 content:"";
 height:1px;
 flex:1;
 background:#303950;
}
.codeInput{
 text-align:center;
 font-size:20px;
 font-weight:900;
 letter-spacing:7px;
}
#error{
 min-height:20px;
 text-align:center;
 color:#ff7188;
 font-size:12px;
 margin-top:10px;
}

/* APP */

#app{
 width:100%;
 height:100dvh;
 display:grid;
 grid-template-columns:235px 1fr;
 background:#090e1b;
}
.sidebar{
 display:flex;
 flex-direction:column;
 min-height:0;
 background:#101629;
 border-right:1px solid #252e46;
}
.roomInfo{
 padding:17px;
 border-bottom:1px solid #252e46;
}
.roomName{
 font-weight:900;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}
.code{
 margin-top:10px;
 padding:10px;
 border-radius:9px;
 background:#202a48;
 text-align:center;
 color:#a8b6ff;
 font-weight:900;
 font-size:18px;
 letter-spacing:5px;
}
.copy{
 width:100%;
 height:37px;
 margin-top:8px;
 border:1px solid #35405e;
 border-radius:9px;
 background:#171f35;
 color:#d1d9ec;
}
.peopleTitle{
 padding:15px 17px 6px;
 color:#7e8ba8;
 font-size:11px;
 font-weight:900;
}
.users{
 flex:1;
 min-height:0;
 overflow-y:auto;
 padding:0 9px;
}
.user{
 display:flex;
 align-items:center;
 gap:9px;
 padding:8px;
 border-radius:10px;
}
.avatar{
 width:34px;
 height:34px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 background:linear-gradient(135deg,#607cff,#925be9);
 font-size:12px;
 font-weight:900;
}
.uname{
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
 font-size:13px;
}
.host{
 color:#ffd463;
 font-size:9px;
 margin-left:5px;
}
.sideButtons{
 padding:10px;
}
.sideButton{
 width:100%;
 height:42px;
 margin-top:7px;
 border:1px solid #303b58;
 border-radius:10px;
 background:#171f35;
 color:#d4dcee;
}
.leave{
 color:#ff8a9d;
}

.main{
 display:flex;
 flex-direction:column;
 min-width:0;
 min-height:0;
}
.header{
 height:60px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 17px;
 background:#0e1425;
 border-bottom:1px solid #252e46;
}
.headerTitle{
 font-weight:900;
}
.status{
 color:#8490aa;
 font-size:10px;
}
.dot{
 display:inline-block;
 width:7px;
 height:7px;
 border-radius:50%;
 background:#3de38b;
 box-shadow:0 0 8px #3de38b;
 margin-right:4px;
}
.messages{
 flex:1;
 min-height:0;
 overflow-y:auto;
 padding:17px;
 overscroll-behavior:contain;
}
.message{
 display:flex;
 margin-bottom:13px;
}
.message.mine{
 justify-content:flex-end;
}
.msgContent{
 max-width:min(72%,650px);
}
.msgTop{
 display:flex;
 gap:8px;
 margin-bottom:4px;
 font-size:10px;
 color:#aeb8ce;
}
.message.mine .msgTop{
 justify-content:flex-end;
}
.time{
 color:#59657e;
 font-size:8px;
}
.bubble{
 padding:10px 13px;
 border-radius:13px;
 background:#19223a;
 line-height:1.45;
 word-break:break-word;
}
.mine .bubble{
 background:linear-gradient(135deg,#5975e7,#7658d8);
}
.system{
 text-align:center;
 color:#69758e;
 font-size:10px;
 margin:11px;
}
.system span{
 display:inline-block;
 padding:6px 10px;
 border-radius:20px;
 background:#121a2d;
}
.chatInputArea{
 flex:none;
 padding:9px 12px;
 padding-bottom:max(9px,env(safe-area-inset-bottom));
 background:#0e1425;
 border-top:1px solid #252e46;
}
.form{
 display:flex;
 gap:7px;
}
.chatInput{
 flex:1;
 min-width:0;
 height:46px;
 border:1px solid #303b56;
 border-radius:12px;
 outline:none;
 background:#141c31;
 color:white;
 padding:0 12px;
}
.send{
 width:62px;
 flex:none;
 border:0;
 border-radius:12px;
 background:#607af4;
 color:white;
 font-weight:900;
}

/* GAME */

#gamePanel{
 position:fixed;
 inset:0;
 z-index:50;
 width:100%;
 height:100dvh;
 background:#080c17;
 display:flex;
 flex-direction:column;
}
.gameHeader{
 height:58px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 13px;
 background:#11182b;
 border-bottom:1px solid #303a56;
}
.gameTitle{
 font-size:18px;
 font-weight:900;
}
.closeGame{
 min-height:40px;
 padding:0 13px;
 border:1px solid #3a4562;
 border-radius:9px;
 background:#202943;
 color:white;
}
.gameBody{
 flex:1;
 min-height:0;
 overflow-y:auto;
 padding:15px;
 overscroll-behavior:contain;
}
.gameMenu,.playArea{
 width:min(900px,100%);
 margin:auto;
 text-align:center;
}
.gameIntro{
 margin-bottom:17px;
}
.gameIntro h1{
 margin:3px 0 6px;
 font-size:28px;
}
.gameIntro p{
 margin:0;
 color:#8995b2;
 font-size:12px;
}
.gameGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}
.gameCard{
 min-height:120px;
 padding:14px;
 border:1px solid #303b58;
 border-radius:16px;
 background:#131b30;
 color:white;
 text-align:left;
}
.gameCard:active{
 transform:scale(.98);
}
.gameIcon{
 font-size:28px;
}
.gameCard b{
 display:block;
 margin-top:8px;
}
.gameCard span{
 display:block;
 margin-top:4px;
 color:#7f8ba7;
 font-size:10px;
}
.modeBox{
 margin:18px 0;
}
.modeBtn{
 min-height:41px;
 padding:0 16px;
 margin:4px;
 border:1px solid #35405d;
 border-radius:10px;
 background:#151e34;
 color:#cbd3e8;
}
.modeBtn.selected{
 background:#607af4;
 border-color:#8497ff;
 color:white;
}
.startGame{
 min-height:47px;
 padding:0 27px;
 border:0;
 border-radius:12px;
 background:linear-gradient(135deg,#5b7cff,#895cff);
 color:white;
 font-weight:900;
}
.wait{
 margin-top:9px;
 color:#8d99b5;
 font-size:11px;
}

.playArea h2{
 margin:3px 0 7px;
 font-size:25px;
}
.playInfo{
 color:#8e9ab7;
 font-size:12px;
 margin-bottom:15px;
}
.small{
 color:#7e8aa5;
 font-size:10px;
 line-height:1.7;
}
.gameBoard{
 position:relative;
 width:100%;
 height:min(55vh,430px);
 min-height:290px;
 border-radius:20px;
 overflow:hidden;
 border:1px solid #303b58;
 background:#111a2d;
 touch-action:none;
}
.reactionBoard{
 width:100%;
 height:100%;
 border:0;
 border-radius:19px;
 background:#d73848;
 color:white;
 font-size:28px;
 font-weight:900;
 touch-action:none;
 user-select:none;
}
.reactionBoard.green{
 background:#20b768;
}
.reactionBoard.false{
 background:#752937;
}
.target{
 position:absolute;
 width:76px;
 height:76px;
 transform:translate(-50%,-50%);
 border:5px solid white;
 border-radius:50%;
 background:#ff536e;
 box-shadow:0 0 20px #ff536e;
 touch-action:none;
}
.numberBox{
 padding:25px 10px;
 margin:15px 0;
 border-radius:17px;
 background:#161f35;
 font-size:55px;
 font-weight:900;
 letter-spacing:7px;
}
.answerInput{
 width:min(300px,100%);
 height:48px;
 border:1px solid #38435f;
 border-radius:11px;
 outline:none;
 background:#10172a;
 color:white;
 text-align:center;
}
.actionBtn{
 min-height:44px;
 padding:0 20px;
 margin:7px;
 border:0;
 border-radius:10px;
 background:#617af5;
 color:white;
 font-weight:900;
}
.colorChoices{
 display:flex;
 justify-content:center;
 gap:9px;
 flex-wrap:wrap;
 margin:18px;
}
.colorChoice{
 width:105px;
 height:58px;
 border:3px solid white;
 border-radius:12px;
 color:white;
 font-weight:900;
}
.sequenceGrid{
 display:grid;
 grid-template-columns:repeat(3,80px);
 gap:9px;
 justify-content:center;
 margin:18px;
}
.seqBtn{
 width:80px;
 height:66px;
 border:0;
 border-radius:12px;
 background:#273451;
 color:white;
 font-size:19px;
 font-weight:900;
}
.seqBtn.lit{
 transform:scale(.94);
 background:#7188ff;
}
.result{
 width:min(600px,100%);
 margin:17px auto;
 padding:18px;
 border:1px solid #34405e;
 border-radius:17px;
 background:#131c31;
}
.resultRow{
 display:flex;
 justify-content:space-between;
 padding:11px 4px;
 border-bottom:1px solid #27324b;
}
.winner{
 color:#ffd35e;
 font-weight:900;
}

/* TEAM */

.teamList{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
 margin:14px auto;
 width:min(600px,100%);
}
.teamBox{
 padding:13px;
 border:1px solid #34405d;
 border-radius:13px;
 background:#151e33;
}
.teamName{
 font-weight:900;
 margin-bottom:6px;
}
.teamMember{
 color:#aeb8ce;
 font-size:11px;
}

/* MODAL */

#codeModal{
 position:fixed;
 inset:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:#000b;
}
.modal{
 width:min(390px,100%);
 padding:27px 20px;
 text-align:center;
 border-radius:22px;
 background:#151d33;
 border:1px solid #35405c;
}
.bigCode{
 margin:17px 0;
 font-size:40px;
 font-weight:900;
 letter-spacing:8px;
 color:#9eb0ff;
}
.modal button{
 min-height:42px;
 padding:0 15px;
 border:0;
 border-radius:10px;
 background:#6079f4;
 color:white;
}

/* MOBILE */

@media(max-width:750px){

 #app{
  display:block;
 }

 .sidebar{
  display:none;
 }

 .header{
  height:55px;
  padding:0 13px;
 }

 .messages{
  padding:13px;
 }

 .msgContent{
  max-width:84%;
 }

 .gameHeader{
  height:55px;
 }

 .gameBody{
  padding:11px;
 }

 .gameGrid{
  grid-template-columns:repeat(2,1fr);
  gap:8px;
 }

 .gameCard{
  min-height:108px;
  padding:11px;
 }

 .gameIcon{
  font-size:25px;
 }

 .gameBoard{
  height:calc(100dvh - 180px);
  min-height:290px;
  max-height:520px;
 }

 .reactionBoard{
  font-size:24px;
 }

 .target{
  width:78px;
  height:78px;
 }

 .numberBox{
  font-size:40px;
  letter-spacing:5px;
 }

 .colorChoice{
  width:45%;
  max-width:150px;
 }

}

@media(max-width:430px){

 .card{
  padding:22px 18px;
 }

 .logo{
  font-size:29px;
 }

 .gameCard{
  min-height:102px;
  padding:10px;
 }

 .gameCard b{
  font-size:13px;
 }

 .gameCard span{
  font-size:9px;
 }

 .sequenceGrid{
  grid-template-columns:repeat(3,1fr);
  max-width:280px;
 }

 .seqBtn{
  width:100%;
  height:62px;
 }

}

@media(max-height:500px) and (orientation:landscape){

 .gameHeader{
  height:46px;
 }

 .gameBody{
  padding:7px;
 }

 .gameBoard{
  height:calc(100dvh - 100px);
  min-height:240px;
 }

}
</style>
</head>

<body>

<!-- START -->

<div id="start">

 <div class="card">

  <div class="logo">ROOM CHAT</div>

  <div class="sub">
   실시간 채팅 + 미니게임
  </div>

  <label>닉네임</label>

  <input
   id="name"
   class="input"
   maxlength="20"
   autocomplete="nickname"
   placeholder="닉네임을 입력하세요"
  >

  <button id="create" class="primary">
   방 만들기
  </button>

  <div class="divider">
   또는
  </div>

  <label>6자리 방 코드</label>

  <input
   id="joinCode"
   class="input codeInput"
   maxlength="6"
   inputmode="numeric"
   autocomplete="off"
   placeholder="000000"
  >

  <button id="join" class="primary">
   방 참가
  </button>

  <div id="error"></div>

 </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

 <aside class="sidebar">

  <div class="roomInfo">

   <div id="roomName" class="roomName">
    채팅방
   </div>

   <div id="roomCode" class="code">
    ------
   </div>

   <button id="copyCode" class="copy">
    방 코드 복사
   </button>

  </div>

  <div class="peopleTitle">
   접속자
  </div>

  <div id="users" class="users"></div>

  <div class="sideButtons">

   <button id="miniButton" class="sideButton">
    🎮 미니게임
   </button>

   <button id="leave" class="sideButton leave">
    방 나가기
   </button>

  </div>

 </aside>


 <main class="main">

  <header class="header">

   <div id="headerName" class="headerTitle">
    채팅방
   </div>

   <div class="status">
    <span class="dot"></span>
    실시간 연결
   </div>

  </header>

  <div id="messages" class="messages"></div>

  <div class="chatInputArea">

   <form id="chatForm" class="form">

    <input
     id="chatInput"
     class="chatInput"
     maxlength="500"
     autocomplete="off"
     placeholder="메시지를 입력하세요..."
    >

    <button class="send">
     전송
    </button>

   </form>

  </div>

 </main>

</div>


<!-- ROOM CODE -->

<div id="codeModal" class="hidden">

 <div class="modal">

  <div>
   친구에게 이 방 코드를 알려주세요
  </div>

  <div id="bigCode" class="bigCode">
   000000
  </div>

  <button id="modalCopy">
   코드 복사
  </button>

  <button id="modalClose"
   style="background:#29334e;margin-left:5px">
   입장하기
  </button>

 </div>

</div>


<!-- GAME -->

<div id="gamePanel" class="hidden">

 <header class="gameHeader">

  <div class="gameTitle">
   🎮 미니게임
  </div>

  <button id="closeGame" class="closeGame">
   채팅으로
  </button>

 </header>

 <div id="gameBody" class="gameBody"></div>

</div>


<script>
"use strict";

/* =====================================================
 STATE
===================================================== */

let peer=null;
let myId="";
let myName="";
let roomCode="";
let host=false;

const connections=new Map();

let selectedMode="solo";

let game={
 type:null,
 mode:"solo",
 running:false,
 round:0,
 state:{},
 scores:{},
 results:[]
};

let localSequence=[];

let gameTimer=null;
let reactionTimer=null;


/* =====================================================
 HELPERS
===================================================== */

const $=id=>document.getElementById(id);

function clean(v,max){
 return String(v||"")
  .replace(/[<>]/g,"")
  .trim()
  .slice(0,max);
}

function escapeHTML(s){
 return String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function showError(t){
 $("error").textContent=t;
}

function toast(t){

 const old=$("toast");

 if(old)old.remove();

 const x=document.createElement("div");

 x.id="toast";
 x.textContent=t;

 Object.assign(x.style,{
  position:"fixed",
  left:"50%",
  bottom:"75px",
  transform:"translateX(-50%)",
  padding:"11px 17px",
  borderRadius:"11px",
  background:"#202a43",
  border:"1px solid #3b4765",
  zIndex:"9999",
  color:"#fff",
  fontSize:"13px"
 });

 document.body.appendChild(x);

 setTimeout(()=>{
  x.remove();
 },1700);
}

function nowTime(t){
 return new Date(t).toLocaleTimeString(
  "ko-KR",
  {
   hour:"2-digit",
   minute:"2-digit"
  }
 );
}


/* =====================================================
 CHAT
===================================================== */

function addSystem(text){

 const d=document.createElement("div");
 d.className="system";

 const s=document.createElement("span");
 s.textContent=text;

 d.appendChild(s);
 $("messages").appendChild(d);

 $("messages").scrollTop=
  $("messages").scrollHeight;
}

function addMessage(data){

 const mine=data.senderId===myId;

 const d=document.createElement("div");
 d.className="message"+(mine?" mine":"");

 const c=document.createElement("div");
 c.className="msgContent";

 const top=document.createElement("div");
 top.className="msgTop";

 const name=document.createElement("span");
 name.textContent=mine?"나":data.name;

 const time=document.createElement("span");
 time.className="time";
 time.textContent=nowTime(data.time);

 top.appendChild(name);
 top.appendChild(time);

 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=data.text;

 c.appendChild(top);
 c.appendChild(bubble);
 d.appendChild(c);

 $("messages").appendChild(d);

 $("messages").scrollTop=
  $("messages").scrollHeight;
}


/* =====================================================
 USERS
===================================================== */

function getUsers(){

 const list=[
  {
   id:myId,
   name:myName,
   host:host
  }
 ];

 connections.forEach(item=>{

  if(
   item.user &&
   !list.some(x=>x.id===item.user.id)
  ){
   list.push(item.user);
  }

 });

 return list.slice(0,5);
}

function drawUsers(){

 const box=$("users");
 box.innerHTML="";

 getUsers().forEach(user=>{

  const row=document.createElement("div");
  row.className="user";

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=
   user.name.charAt(0).toUpperCase();

  const name=document.createElement("div");
  name.className="uname";
  name.textContent=user.name;

  if(user.host){

   const h=document.createElement("span");
   h.className="host";
   h.textContent="방장";

   name.appendChild(h);
  }

  row.appendChild(avatar);
  row.appendChild(name);

  box.appendChild(row);
 });
}


/* =====================================================
 NETWORK
===================================================== */

function send(conn,data){

 if(!conn || !conn.open)return false;

 try{
  conn.send(data);
  return true;
 }catch(e){
  return false;
 }
}

function broadcast(data,exceptId=null){

 connections.forEach(item=>{

  if(
   item.conn &&
   item.conn.open &&
   item.conn.peer!==exceptId
  ){
   send(item.conn,data);
  }

 });
}

function connectConnection(conn){

 const item={
  conn:conn,
  user:null
 };

 connections.set(
  conn.peer,
  item
 );

 conn.on("open",()=>{

  send(conn,{
   type:"hello",
   user:{
    id:myId,
    name:myName,
    host:host
   }
  });

  if(host){
   sendRoomState(conn);
  }

 });

 conn.on("data",data=>{
  receiveData(conn,data);
 });

 conn.on("close",()=>{

  const old=connections.get(conn.peer);

  const name=old?.user?.name;

  connections.delete(conn.peer);

  drawUsers();

  if(name){
   addSystem(name+"님이 나갔습니다.");
  }

 });

 conn.on("error",()=>{
  connections.delete(conn.peer);
  drawUsers();
 });

}

function sendRoomState(conn){

 send(conn,{
  type:"users",
  users:getUsers()
 });

 if(game.running || game.results.length){

  send(conn,{
   type:"gameState",
   game:game
  });

 }

}

function receiveData(conn,data){

 if(!data)return;


 /* HELLO */

 if(data.type==="hello"){

  const item=connections.get(conn.peer);

  if(item){
   item.user=data.user;
  }

  drawUsers();

  if(host){
   sendRoomState(conn);
   broadcast({
    type:"users",
    users:getUsers()
   });
  }

  return;
 }


 /* USERS */

 if(data.type==="users"){

  data.users.forEach(u=>{

   if(u.id===myId)return;

   const item=connections.get(u.id);

   if(item){
    item.user=u;
   }

  });

  drawUsers();

  return;
 }


 /* CHAT */

 if(data.type==="chat"){

  addMessage(data);

  if(host){
   broadcast(data,conn.peer);
  }

  return;
 }


 /* GAME COMMAND */

 if(data.type==="gameCommand"){

  if(host){

   processGameCommand(
    data.command,
    data.payload,
    conn.peer
   );

  }

  return;
 }


 /* GAME STATE */

 if(data.type==="gameState"){

  game=data.game;

  openGame();
  renderGame();

  return;
 }

}

function gameBroadcast(){

 broadcast({

  game:game
 });

 if(host){

  processGameCommand(
   command,
   payload,
   myId
  );

 }else{

  const conn=
   [...connections.values()]
    .find(x=>x.conn?.open);

  if(conn){

   send(conn.conn,{
    type:"gameCommand",
    command:command,
    payload:payload
   });

  }

 }

}

function startGame(){

 if(!host)return;

 const players=getUsers();

 if(players.length<2){

  toast("최소 2명이 필요합니다.");
  return;

 }

 game={
  type:game.type,
  mode:selectedMode,
  running:true,
  round:1,
  state:{},
  scores:{},
  results:[]
 };

 players.forEach(p=>{

  game.scores[p.id]={
   name:p.name,
   score:0,
   times:[]
  };

 });

 broadcast({
  type:"gameState",
  game:game
 });

 beginRound();

}

function processGameCommand(
 command,
 payload,
 sender
){

 if(command==="reactionClick")
  reactionClick(sender);

 if(command==="targetClick")
  targetClick(sender);

 if(command==="memoryAnswer")
  memoryAnswer(sender,payload);

 if(command==="mathAnswer")
  mathAnswer(sender,payload);

 if(command==="colorAnswer")
  colorAnswer(sender,payload);

 if(command==="sequenceAnswer")
  sequenceAnswer(sender,payload);

}


/* =====================================================
 ROUND
===================================================== */

function beginRound(){

 if(!game.running)return;

 localSequence=[];

 if(game.type==="reaction")
  beginReaction();

 else if(game.type==="target")
  beginTarget();

 else if(game.type==="memory")
  beginMemory();

 else if(game.type==="math")
  beginMath();

 else if(game.type==="color")
  beginColor();

 else if(game.type==="sequence")
  beginSequence();

 renderGame();
}


/* =====================================================
 REACTION
===================================================== */

function beginReaction(){

 clearTimeout(reactionTimer);

 const greenAt=
  Date.now()+
  2500+
  Math.floor(
   Math.random()*3000
  );

 game.state={
  phase:"red",
  greenAt:greenAt,
  clicks:{}
 };

 gameBroadcast();

 reactionTimer=setTimeout(()=>{

  if(!game.running)return;

  game.state.phase="green";
  game.state.greenAt=Date.now();

  gameBroadcast();

  reactionTimer=setTimeout(
   finishReactionRound,
   6000
  );

 },greenAt-Date.now());

}

function reactionClick(id){

 if(!game.running)return;

 if(!game.scores[id])return;

 if(game.state.clicks[id])return;

 if(game.state.phase==="red"){

  game.state.clicks[id]=9999;

  game.scores[id]
   .times.push(9999);

  game.scores[id].score-=1;

  game.state.phase="false";

  gameBroadcast();

  setTimeout(
   finishReactionRound,
   1000
  );

  return;
 }

 if(game.state.phase!=="green")return;

 const ms=
  Date.now()-
  game.state.greenAt;

 game.state.clicks[id]=ms;

 game.scores[id]
  .times.push(ms);

 game.scores[id].score++;

 gameBroadcast();

 if(
  Object.keys(game.state.clicks).length>=
  getUsers().length
 ){

  finishReactionRound();

 }

}

function finishReactionRound(){

 if(!game.running)return;

 if(game.type!=="reaction")return;

 const players=getUsers();

 players.forEach(p=>{

  if(!game.state.clicks[p.id]){

   game.state.clicks[p.id]=5000;

   game.scores[p.id]
    .times.push(5000);

  }

 });

 gameBroadcast();

 setTimeout(nextRound,1300);

}

/* =====================================================
 SEQUENCE
===================================================== */

function beginSequence(){

 const length=Math.min(
  3+game.round,
  7
 );

 const sequence=[];

 for(let i=0;i<length;i++){

  sequence.push(
   Math.floor(
    Math.random()*9
   )
  );

 }

 game.state={
  sequence:sequence,
  phase:"show",
  index:-1,
  answered:{}
 };

 gameBroadcast();

 let i=-1;

 const timer=setInterval(()=>{

  if(!game.running){

   clearInterval(timer);
   return;

  }

  i++;

  if(i>=sequence.length){

   clearInterval(timer);

   game.state.phase="input";
   game.state.index=-1;

  }else{

   game.state.index=i;

  }

  gameBroadcast();

 },550);

}

function sequenceAnswer(id,payload){

 if(game.state.answered[id])return;

 game.state.answered[id]=true;

 const answer=
  Array.isArray(payload)
   ?payload.map(Number)
   :[];

 const correct=
  JSON.stringify(answer)===
  JSON.stringify(
   game.state.sequence
  );

 if(correct){

  game.scores[id].score++;

 }

 gameBroadcast();

 if(
  Object.keys(game.state.answered).length>=
  getUsers().length
 ){

  setTimeout(nextRound,900);

 }

}


/* =====================================================
 NEXT
===================================================== */

function nextRound(){

 game.round++;

  finishGame();

 }else{

 }

}


/* =====================================================
 FINISH
===================================================== */

function finishGame(){

 game.running=false;

 clearInterval(gameTimer);
 clearTimeout(reactionTimer);

 game.results=
  Object.entries(game.scores)
   .map(([id,v])=>({
    id:id,
    name:v.name,
    score:v.score,
    times:v.times
   }))
   .sort(
    (a,b)=>b.score-a.score
   );

 gameBroadcast();

}

  renderMemory();

 else if(game.type==="math")
  renderMath();

  renderColor();

  renderSequence();

}

    Object.entries(
     game.state.clicks||{}
    )
    .map(([id,ms])=>{

     const p=game.scores[id];

     return `
      ${escapeHTML(p?.name||"플레이어")}
      :
      ${
       ms>=9999
        ?"실격/5초"
        :ms+"ms"
      }
      <br>
     `;

    })
    .join("")
   }

  </div>

 </div>
 `;

}


/* =====================================================
 TARGET
===================================================== */

function renderTarget(){

 const s=game.state;

 $("gameBody").innerHTML=
  gameTop(
   "🎯 타겟 클릭",
   `남은 시간 ${s.time}초`
  )+
 `
  <div class="gameBoard">

   <button
    class="target"
    style="
     left:${s.target.x}%;
     top:${s.target.y}%;
    "
    onclick="gameCommand('targetClick')"
   ></button>

  </div>

  <div class="small">

   ${
    Object.values(game.scores)
     .map(x=>
      escapeHTML(x.name)+
      " "+x.score+"점"
     )
     .join(" · ")
   }

  </div>

 </div>
 `;

}


/* =====================================================
 MEMORY
===================================================== */

function renderMemory(){

 const s=game.state;

 $("gameBody").innerHTML=
  gameTop(
   "🧠 숫자 기억",

/* =====================================================
 COLOR
===================================================== */

  gameTop(

/* =====================================================
 SEQUENCE
===================================================== */

function renderSequence(){

 const s=game.state;

 let content="";

 if(s.phase==="show"){

  let display="●";

  if(
   s.index>=0 &&
   s.index<s.sequence.length
  ){

   display=
    s.sequence[s.index]+1;

  }

  content=`

   <div
    class="numberBox"
    style="font-size:45px"
   >
    ${display}
   </div>

   <p>
    순서를 기억하세요!
   </p>

  `;

 }else{

  content=`

   <p>
    나온 순서대로 누르세요.
   </p>

   <div class="sequenceGrid">

    ${
     Array.from(
      {length:9},
      (_,i)=>`

       <button
        class="seqBtn"
        onclick="sequenceLocal(${i})"
       >
        ${i+1}
       </button>

      `
     ).join("")
    }

   </div>

   <div id="seqCurrent" class="small">
    입력:
   </div>

   <button
    class="actionBtn"
    onclick="sequenceSubmit()"
   >
    제출
   </button>

  `;

 }

 $("gameBody").innerHTML=
  gameTop(
   "🧩 순서 기억",
   "나타난 순서를 기억하세요."
  )+
  content+
  "</div>";

}

function sequenceLocal(n){

 if(
  localSequence.length>=
  game.state.sequence.length
 )return;

 localSequence.push(n);

 const b=
  document.querySelectorAll(".seqBtn")[n];

 if(b){

  b.classList.add("lit");

  setTimeout(()=>{
   b.classList.remove("lit");
  },120);

 }

 const box=$("seqCurrent");

 if(box){

  box.textContent=
   "입력: "+
   localSequence
    .map(x=>x+1)
    .join(" → ");

 }

}

function sequenceSubmit(){

 gameCommand(
  "sequenceAnswer",
  [...localSequence]
 );

 localSequence=[];

}


/* =====================================================
 RESULTS
===================================================== */

function renderResults(){

 const results=game.results||[];

 $("gameBody").innerHTML=`

 <div class="playArea">

  <h2>🏆 최종 결과</h2>

  <div class="result">

   ${
    results.map((x,i)=>`

     <div class="resultRow">

      <span class="${i===0?"winner":""}">
       ${
        i===0
         ?"🏆 "
         :""
       }
       ${i+1}위
       ${escapeHTML(x.name)}
      </span>

      <b>
       ${x.score}점
      </b>

     </div>

    `).join("")
   }

  </div>

  ${
   host
    ?`
     <button
      class="actionBtn"
      onclick="showGameMenu()"
     >
      다른 게임
     </button>
    `
    :""
  }

 </div>

 `;

}


/* =====================================================
 ENTER KEY
===================================================== */

$("name").addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter"){
   createRoom();
  }
 }
);

$("joinCode").addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter"){
   joinRoom();
  }
 }
);

$("joinCode").addEventListener(
 "input",
 ()=>{
  $("joinCode").value=
   $("joinCode").value
    .replace(/\D/g,"")
    .slice(0,6);
 }
);


/* =====================================================
 MOBILE SAFE
===================================================== */

document.addEventListener(
 "contextmenu",
 e=>{

  if(
   e.target.closest("#gamePanel")
  ){
   e.preventDefault();
  }

 }
);

document.addEventListener(
 "gesturestart",
 e=>{
  e.preventDefault();
 }
);

</script>
