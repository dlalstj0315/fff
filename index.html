<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ROOM CHAT + MINIGAMES</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,"Noto Sans KR",sans-serif}
body{background:#080c17;color:#fff;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#start{
 width:100%;height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at 15% 15%,#334d9b 0,transparent 35%),
 radial-gradient(circle at 85% 85%,#65317f 0,transparent 35%),#080c17
}
.card{
 width:min(470px,100%);padding:32px;border-radius:25px;background:#151d33;
 border:1px solid #303a58;box-shadow:0 30px 90px #0008
}
.logo{text-align:center;font-size:38px;font-weight:900;letter-spacing:3px}
.sub{text-align:center;color:#8995b3;margin:8px 0 28px}
label{display:block;color:#aab5cf;font-size:13px;margin:14px 0 7px}
.input{
 width:100%;padding:14px;border:1px solid #35405e;border-radius:12px;
 outline:none;background:#10172a;color:#fff
}
.input:focus{border-color:#7189ff}
.primary{
 width:100%;padding:14px;border:0;border-radius:12px;margin-top:14px;
 background:linear-gradient(135deg,#587cff,#895cff);color:white;font-weight:800
}
.divider{display:flex;align-items:center;gap:10px;margin:22px 0;color:#606b87;font-size:12px}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:#303950}
.codeInput{text-align:center;font-size:22px;font-weight:800;letter-spacing:8px}
#error{min-height:20px;color:#ff7189;text-align:center;margin-top:13px;font-size:13px}

#app{
 width:100%;height:100vh;display:grid;grid-template-columns:245px 1fr;background:#0a0f1d
}
.sidebar{display:flex;flex-direction:column;background:#101629;border-right:1px solid #252e46}
.roomInfo{padding:20px;border-bottom:1px solid #252e46}
.roomName{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{
 margin-top:10px;padding:9px;text-align:center;letter-spacing:5px;font-size:18px;
 font-weight:900;color:#9eaeff;background:#202a48;border-radius:9px
}
.copy{
 width:100%;margin-top:9px;padding:9px;border:1px solid #34405e;border-radius:9px;
 background:#161e34;color:#c8d0e5
}
.peopleTitle{padding:18px 18px 8px;color:#7e8aa8;font-size:12px;font-weight:800}
.users{flex:1;overflow:auto;padding:0 10px}
.user{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px}
.user:hover{background:#ffffff08}
.avatar{
 width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
 justify-content:center;background:linear-gradient(135deg,#617cff,#965cff);
 font-size:12px;font-weight:900;flex-shrink:0
}
.uname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.host{color:#ffd467;font-size:10px;margin-left:5px}
.sideButtons{padding:12px}
.sideButton{
 width:100%;padding:11px;margin-top:7px;border:1px solid #303b58;
 border-radius:10px;background:#171f35;color:#d5dcef
}
.leave{color:#ff8a9b;background:#211621;border-color:#49303d}

.main{min-width:0;display:flex;flex-direction:column}
.header{
 height:65px;display:flex;align-items:center;justify-content:space-between;
 padding:0 20px;background:#0e1425;border-bottom:1px solid #252e46
}
.headerTitle{font-size:17px;font-weight:800}
.status{color:#7e8aa6;font-size:12px}
.dot{
 display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ee18b;
 box-shadow:0 0 9px #3ee18b;margin-right:6px
}

.messages{flex:1;overflow-y:auto;padding:20px}
.message{display:flex;margin-bottom:15px}
.message.mine{justify-content:flex-end}
.msgContent{max-width:min(70%,650px)}
.msgTop{display:flex;gap:8px;margin-bottom:4px;font-size:11px;color:#aeb9d1}
.message.mine .msgTop{justify-content:flex-end}
.time{color:#59657f;font-size:9px}
.bubble{
 padding:10px 13px;border-radius:13px;background:#19223a;
 line-height:1.45;word-break:break-word
}
.mine .bubble{background:linear-gradient(135deg,#5974e7,#7657d9)}
.system{text-align:center;color:#65718c;font-size:11px;margin:12px}
.system span{padding:6px 10px;background:#121a2d;border-radius:20px}

.chatInputArea{padding:12px 16px;background:#0e1425;border-top:1px solid #252e46}
.form{display:flex;gap:8px}
.chatInput{
 flex:1;min-width:0;padding:12px;border:1px solid #303a56;border-radius:12px;
 outline:none;background:#141c31;color:#fff
}
.send{width:65px;border:0;border-radius:12px;background:#5f79f5;color:#fff;font-weight:800}

/* MINI GAME */

#gamePanel{
 position:fixed;inset:0;background:#080c17;z-index:50;
 display:flex;flex-direction:column
}
.gameHeader{
 height:65px;display:flex;align-items:center;justify-content:space-between;
 padding:0 20px;background:#11182b;border-bottom:1px solid #303a56
}
.gameTitle{font-size:19px;font-weight:900}
.closeGame{padding:9px 13px;border:1px solid #3a4562;border-radius:9px;background:#202943;color:#fff}
.gameBody{flex:1;overflow:auto;padding:25px}
.gameMenu{max-width:850px;margin:auto}
.gameIntro{text-align:center;margin-bottom:22px}
.gameIntro h1{margin:0 0 7px;font-size:30px}
.gameIntro p{color:#8995b2}
.gameGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gameCard{
 min-height:130px;padding:18px;border:1px solid #303b58;border-radius:17px;
 background:#131b30;text-align:left;color:#fff
}
.gameCard:hover{border-color:#6f86ff;background:#18213a}
.gameIcon{font-size:30px}
.gameCard b{display:block;margin-top:10px;font-size:16px}
.gameCard span{display:block;color:#7f8ba7;font-size:12px;margin-top:5px}
.modeBox{margin:22px 0;text-align:center}
.modeBtn{
 padding:10px 18px;margin:4px;border:1px solid #35405d;border-radius:10px;
 background:#151e34;color:#cbd3e8
}
.modeBtn.selected{background:#607af4;border-color:#8497ff;color:#fff}
.startGame{
 display:block;margin:18px auto 0;padding:13px 30px;border:0;border-radius:12px;
 background:linear-gradient(135deg,#5b7cff,#895cff);color:white;font-weight:900
}
.wait{text-align:center;color:#8d99b5;margin-top:13px}
.playArea{max-width:900px;margin:auto;text-align:center}
.playArea h2{font-size:27px}
.playInfo{color:#8e9ab7;margin-bottom:20px}
.gameBoard{
 position:relative;min-height:380px;border-radius:20px;background:#111a2d;
 border:1px solid #303b58;overflow:hidden
}
.reactionBoard{
 width:100%;height:380px;border:0;background:#d73848;color:#fff;
 font-size:30px;font-weight:900
}
.reactionBoard.green{background:#22b86a}
.reactionBoard.false{background:#762936}
.target{
 position:absolute;width:65px;height:65px;border-radius:50%;border:5px solid #fff;
 background:#ff536e;box-shadow:0 0 20px #ff536e
}
.numberBox{
 padding:35px;font-size:65px;font-weight:900;letter-spacing:10px;
 background:#161f35;border-radius:18px;margin:20px 0
}
.answerInput{
 padding:13px;text-align:center;border-radius:11px;border:1px solid #38435f;
 background:#10172a;color:#fff;outline:none;width:min(300px,100%)
}
.actionBtn{
 padding:12px 20px;border:0;border-radius:10px;background:#617af5;color:white;
 font-weight:800;margin:6px
}
.colorChoices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:25px}
.colorChoice{
 width:100px;height:60px;border:3px solid #fff;border-radius:12px;color:#fff;
 font-weight:900
}
.sequenceGrid{
 display:grid;grid-template-columns:repeat(3,90px);gap:10px;justify-content:center;margin:25px
}
.seqBtn{
 width:90px;height:70px;border:0;border-radius:12px;background:#273451;color:#fff;font-size:20px;font-weight:900
}
.seqBtn.lit{background:#fff;color:#111}
.result{
 max-width:600px;margin:20px auto;padding:20px;border:1px solid #34405e;
 border-radius:17px;background:#131c31
}
.result h2{margin-top:0}
.resultRow{
 display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid #27324b
}
.winner{color:#ffd35e;font-weight:900}
.small{color:#7e8aa5;font-size:12px}

/* MODAL */

#codeModal{
 position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;
 z-index:100
}
.modal{
 width:min(400px,90%);padding:30px;text-align:center;border-radius:22px;
 background:#151d33;border:1px solid #35405c
}
.bigCode{font-size:42px;font-weight:900;letter-spacing:9px;color:#9eb0ff;margin:17px 0}
.modal button{padding:11px 17px;border:0;border-radius:10px;background:#6079f4;color:#fff}

@media(max-width:750px){
 #app{grid-template-columns:1fr}
 .sidebar{display:none}
 .gameGrid{grid-template-columns:repeat(2,1fr)}
 .gameBody{padding:15px}
 .gameBoard{min-height:330px}
 .reactionBoard{height:330px}
 .msgContent{max-width:82%}
}

@media(max-width:430px){
 .gameGrid{grid-template-columns:1fr}
 .gameCard{min-height:105px}
 .numberBox{font-size:40px}
}
</style>
</head>

<body>

<!-- START -->

<div id="start">
 <div class="card">

  <div class="logo">ROOM CHAT</div>
  <div class="sub">친구들과 채팅하고 미니게임을 즐겨보세요</div>

  <label>닉네임</label>
  <input id="name" class="input" maxlength="20" placeholder="닉네임">

  <button id="create" class="primary">새 방 만들기</button>

  <div class="divider">또는</div>

  <label>6자리 방 코드</label>
  <input id="joinCode" class="input codeInput" maxlength="6"
         inputmode="numeric" placeholder="000000">

  <button id="join" class="primary">방 들어가기</button>

  <div id="error"></div>

 </div>
</div>


<!-- APP -->

<div id="app" class="hidden">

 <aside class="sidebar">

  <div class="roomInfo">
   <div id="roomName" class="roomName">채팅방</div>
   <div id="roomCode" class="code">000000</div>
   <button id="copyCode" class="copy">방 코드 복사</button>
  </div>

  <div class="peopleTitle">접속자</div>

  <div id="users" class="users"></div>

  <div class="sideButtons">
   <button id="miniButton" class="sideButton">🎮 미니게임</button>
   <button id="leave" class="sideButton leave">방 나가기</button>
  </div>

 </aside>

 <main class="main">

  <header class="header">
   <div id="headerName" class="headerTitle">채팅방</div>
   <div class="status"><span class="dot"></span>실시간</div>
  </header>

  <div id="messages" class="messages"></div>

  <div class="chatInputArea">
   <form id="chatForm" class="form">
    <input id="chatInput" class="chatInput"
           maxlength="500" autocomplete="off"
           placeholder="메시지를 입력하세요...">
    <button class="send">전송</button>
   </form>
  </div>

 </main>
</div>


<!-- CODE MODAL -->

<div id="codeModal" class="hidden">
 <div class="modal">
  <div>친구에게 이 방 코드를 알려주세요</div>
  <div id="bigCode" class="bigCode">000000</div>
  <button id="modalCopy">코드 복사</button>
  <button id="modalClose" style="background:#29334e;margin-left:5px">
   입장하기
  </button>
 </div>
</div>


<!-- GAME -->

<div id="gamePanel" class="hidden">

 <header class="gameHeader">
  <div class="gameTitle">🎮 미니게임</div>
  <button id="closeGame" class="closeGame">채팅으로</button>
 </header>

 <div id="gameBody" class="gameBody"></div>

</div>


<script>
/* =========================================
   BASIC STATE
========================================= */

let peer = null;
let myId = "";
let myName = "";
let roomCode = "";
let roomTitle = "";
let host = false;

let connections = new Map();

let game = {
 type:null,
 mode:"solo",
 running:false,
 round:0,
 state:null,
 scores:{},
 results:[]
};

const $ = id => document.getElementById(id);

function clean(v,max){
 return String(v || "")
   .replace(/[<>]/g,"")
   .trim()
   .slice(0,max);
}

function error(t){
 $("error").textContent=t;
}

function toast(t){
 const old=$("toast");
 if(old) old.remove();

 const x=document.createElement("div");
 x.id="toast";
 x.textContent=t;

 Object.assign(x.style,{
  position:"fixed",
  left:"50%",
  bottom:"80px",
  transform:"translateX(-50%)",
  padding:"11px 17px",
  background:"#202a43",
  border:"1px solid #3b4765",
  borderRadius:"10px",
  zIndex:999,
  color:"#fff"
 });

 document.body.appendChild(x);

 setTimeout(()=>x.remove(),1800);
}

function time(t){
 return new Date(t).toLocaleTimeString("ko-KR",{
  hour:"2-digit",
  minute:"2-digit"
 });
}

function system(t){
 const d=document.createElement("div");
 d.className="system";
 const s=document.createElement("span");
 s.textContent=t;
 d.appendChild(s);
 $("messages").appendChild(d);
 $("messages").scrollTop=$("messages").scrollHeight;
}

function message(data){

 const mine=data.senderId===myId;

 const d=document.createElement("div");
 d.className="message"+(mine?" mine":"");

 const c=document.createElement("div");
 c.className="msgContent";

 const top=document.createElement("div");
 top.className="msgTop";

 const n=document.createElement("span");
 n.textContent=mine?"나":data.name;

 const tm=document.createElement("span");
 tm.className="time";
 tm.textContent=time(data.time);

 top.appendChild(n);
 top.appendChild(tm);

 const b=document.createElement("div");
 b.className="bubble";
 b.textContent=data.text;

 c.appendChild(top);
 c.appendChild(b);
 d.appendChild(c);

 $("messages").appendChild(d);
 $("messages").scrollTop=$("messages").scrollHeight;
}


/* =========================================
   USERS
========================================= */

function allUsers(){

 const arr=[
  {
   id:myId,
   name:myName,
   host:host
  }
 ];

 connections.forEach(c=>{
  if(c.user && !arr.some(x=>x.id===c.user.id)){
   arr.push(c.user);
  }
 });

 return arr.slice(0,5);
}

function drawUsers(){

 const box=$("users");
 box.innerHTML="";

 allUsers().forEach(u=>{

  const d=document.createElement("div");
  d.className="user";

  const a=document.createElement("div");
  a.className="avatar";
  a.textContent=u.name.charAt(0).toUpperCase();

  const n=document.createElement("div");
  n.className="uname";
  n.textContent=u.name;

  if(u.host){
   const h=document.createElement("span");
   h.className="host";
   h.textContent="방장";
   n.appendChild(h);
  }

  d.appendChild(a);
  d.appendChild(n);

  box.appendChild(d);
 });
}


/* =========================================
   PEER CONNECTION
========================================= */

function connect(conn){

 const item={
  conn,
  user:null
 };

 connections.set(conn.peer,item);

 conn.on("open",()=>{

  conn.send({
   type:"hello",
   user:{
    id:myId,
    name:myName,
    host
   }
  });

  if(host){
   sendFullState(conn);
  }
 });

 conn.on("data",data=>{
  receive(conn,data);
 });

 conn.on("close",()=>{

  const old=connections.get(conn.peer);
  const name=old?.user?.name;

  connections.delete(conn.peer);
  drawUsers();

  if(name){
   system(name+"님이 나갔습니다.");
  }
 });

 conn.on("error",()=>{
  connections.delete(conn.peer);
  drawUsers();
 });
}

function broadcast(data,except=null){

 connections.forEach(x=>{

  if(
   x.conn &&
   x.conn.open &&
   x.conn.peer!==except
  ){

   try{
    x.conn.send(data);
   }catch(e){}
  }
 });
}

function sendFullState(conn){

 conn.send({
  type:"fullUsers",
  users:allUsers()
 });

 if(game.running){

  conn.send({
   type:"gameState",
   game:game
  });
 }
}

function receive(conn,data){

 if(!data)return;

 if(data.type==="hello"){

  const item=connections.get(conn.peer);

  if(item){
   item.user=data.user;
  }

  drawUsers();

  if(host){
   sendFullState(conn);
  }

  return;
 }


 if(data.type==="fullUsers"){

  data.users.forEach(u=>{

   if(u.id===myId)return;

   const existing=connections.get(u.id);

   if(existing){
    existing.user=u;
   }

  });

  drawUsers();

  return;
 }


 if(data.type==="chat"){

  message(data);

  if(host){
   broadcast(data,conn.peer);
  }

  return;
 }


 if(data.type==="gameCommand"){

  if(host){

   processGameCommand(
    data.command,
    data.payload,
    conn.peer
   );

  }

  return;
 }


 if(data.type==="gameState"){

  game=data.game;

  renderGameState();

  return;
 }


 if(data.type==="gameInvite"){

  game=data.game;

  openGame();

  renderGameState();

  return;
 }


 if(data.type==="playerCount"){

  drawUsers();

 }
}


/* =========================================
   START / JOIN
========================================= */

$("create").onclick=()=>{

 const name=clean($("name").value,20);

 if(!name){
  error("닉네임을 입력해주세요.");
  return;
 }

 myName=name;
 roomCode=String(
  Math.floor(100000+Math.random()*900000)
 );

 roomTitle="친구 채팅방";
 host=true;

 peer=new Peer(
  "roomchat-"+roomCode,
  {debug:0}
 );

 peer.on("open",id=>{

  myId=id;

  $("start").classList.add("hidden");
  $("app").classList.remove("hidden");

  $("roomName").textContent=roomTitle;
  $("headerName").textContent=roomTitle;
  $("roomCode").textContent=roomCode;
  $("bigCode").textContent=roomCode;

  drawUsers();

  $("codeModal").classList.remove("hidden");

  system(
   "방이 만들어졌습니다. 친구에게 "+roomCode+"을 알려주세요."
  );
 });

 peer.on("connection",conn=>{

  if(allUsers().length>=5){
   conn.on("open",()=>{
    conn.send({
     type:"chat",
     name:"SYSTEM",
     text:"이 방은 최대 5명입니다.",
     time:Date.now(),
     senderId:"system"
    });
    conn.close();
   });
   return;
  }

  connect(conn);
 });

 peer.on("error",e=>{
  error("방을 만들지 못했습니다. 다시 시도해주세요.");
  console.error(e);
 });
};


$("join").onclick=()=>{

 const name=clean($("name").value,20);
 const code=$("joinCode").value.replace(/\D/g,"").slice(0,6);

 if(!name){
  error("닉네임을 입력해주세요.");
  return;
 }

 if(code.length!==6){
  error("6자리 방 코드를 입력해주세요.");
  return;
 }

 myName=name;
 roomCode=code;
 host=false;

 peer=new Peer(undefined,{debug:0});

 peer.on("open",id=>{

  myId=id;

  const conn=peer.connect(
   "roomchat-"+roomCode,
   {reliable:true}
  );

  connect(conn);

  conn.on("open",()=>{

   $("start").classList.add("hidden");
   $("app").classList.remove("hidden");

   $("roomName").textContent="채팅방";
   $("headerName").textContent="채팅방";
   $("roomCode").textContent=roomCode;

   drawUsers();

   system("방에 연결되었습니다.");

  });

 });

 peer.on("error",e=>{

  console.error(e);

  if(e.type==="peer-unavailable"){
   error("존재하지 않는 방입니다.");
  }else{
   error("방에 연결하지 못했습니다.");
  }
 });
};


$("joinCode").oninput=()=>{
 $("joinCode").value=
  $("joinCode").value.replace(/\D/g,"").slice(0,6);
};


/* =========================================
   CHAT
========================================= */

$("chatForm").onsubmit=e=>{

 e.preventDefault();

 const text=clean($("chatInput").value,500);

 if(!text)return;

 const data={
  type:"chat",
  senderId:myId,
  name:myName,
  text,
  time:Date.now()
 };

 message(data);

 if(host){
  broadcast(data);
 }else{
  const first=connections.values().next().value;

  if(first?.conn?.open){
   first.conn.send(data);
  }
 }

 $("chatInput").value="";
};


$("copyCode").onclick=copyCode;
$("modalCopy").onclick=copyCode;

async function copyCode(){

 try{
  await navigator.clipboard.writeText(roomCode);
  toast("방 코드가 복사되었습니다.");
 }catch{
  prompt("방 코드:",roomCode);
 }
}

$("modalClose").onclick=()=>{
 $("codeModal").classList.add("hidden");
};


/* =========================================
   LEAVE
========================================= */

$("leave").onclick=()=>{

 if(confirm("방에서 나갈까요?")){

  connections.forEach(x=>{
   try{x.conn.close()}catch(e){}
  });

  if(peer){
   peer.destroy();
  }

  location.reload();
 }
};


/* =========================================
   GAME MENU
========================================= */

$("miniButton").onclick=()=>{
 openGame();
 showMenu();
};

$("closeGame").onclick=()=>{
 $("gamePanel").classList.add("hidden");
};

function openGame(){
 $("gamePanel").classList.remove("hidden");
}

   <h1>🎮 미니게임</h1>
   <p>최대 5명이 함께 플레이할 수 있습니다.</p>
  </div>

  <div class="gameGrid">

   </button>

    <div class="gameIcon">🎯</div>

    <span>20초 동안 타겟 많이 누르기</span>

    <span>표시된 색을 선택하기</span>

    <b>순서 기억</b>

let selectedMode="solo";

function setMode(mode,button){

 selectedMode=mode;

 document.querySelectorAll(".modeBtn")
  .forEach(x=>x.classList.remove("selected"));

 button.classList.add("selected");
}

function selectGame(type){

 game.type=type;

 $("gameBody").innerHTML=`

 <div class="gameMenu">

  <div class="gameIntro">
   <h1>${gameName(type)}</h1>
   <p>${gameDescription(type)}</p>
  </div>

  <div class="modeBox">
   현재 방식:
   <b>${selectedMode==="solo"?"개인전":"2팀전"}</b>
  </div>

  <button class="startGame" onclick="startGame()">
   ${host?"게임 시작":"방장이 시작하기를 기다리는 중"}
  </button>

  <div class="wait">
   ${host?"방장만 게임을 시작할 수 있습니다.":"방장에게 게임 시작을 요청하세요."}
  </div>

 </div>
 `;
}

function gameName(t){

 return {
  reaction:"⚡ 순간 반응",
  target:"🎯 타겟 클릭",
  memory:"🧠 숫자 기억",
  math:"🔢 빠른 계산",
  color:"🟢 색깔 맞히기",
  sequence:"🧩 순서 기억"
 }[t];
}

function gameDescription(t){

 return {
  reaction:"화면이 빨간색에서 초록색으로 바뀌는 순간 클릭하세요.",
  target:"20초 동안 나타나는 타겟을 최대한 많이 클릭하세요.",
  memory:"잠깐 보여주는 숫자를 기억하고 입력하세요.",
  math:"계산 문제를 보고 정답을 입력하세요.",
  color:"문제에 나온 색과 같은 색 버튼을 누르세요.",
  sequence:"불이 들어온 버튼들의 순서를 기억하세요."
 }[t];
}


/* =========================================
   GAME NETWORK
========================================= */

function gameBroadcast(){

 if(!host)return;

 broadcast({
  type:"gameState",
  game:game
 });
}

function gameCommand(command,payload){

 if(host){
  processGameCommand(command,payload,myId);
 }else{

  const first=
   [...connections.values()]
    .find(x=>x.conn?.open);

  if(first){
   first.conn.send({
    type:"gameCommand",
    command,
    payload
   });
  }
 }
}

function startGame(){

 if(!host){
  toast("방장만 시작할 수 있습니다.");
  return;
 }

 if(allUsers().length<1)return;

 game={
  type:game.type,
  mode:selectedMode,
  running:true,
  round:1,
  state:{},
  scores:{},
  results:[],
  startedAt:Date.now()
 };

 allUsers().forEach(u=>{
  game.scores[u.id]={
   name:u.name,
   score:0,
   times:[]
  };
 });

 broadcast({
  type:"gameInvite",
  game:game
 });

 gameBroadcast();

 beginRound();
}


/* =========================================
   GAME PROCESSING
========================================= */

function processGameCommand(command,payload,sender){

 if(!host)return;

 if(command==="reactionClick"){
  reactionClick(sender);
 }

 if(command==="targetClick"){
  targetClick(sender);
 }

 if(command==="memoryAnswer"){
  memoryAnswer(sender,payload);
 }

 if(command==="mathAnswer"){
  mathAnswer(sender,payload);
 }

 if(command==="colorAnswer"){
  colorAnswer(sender,payload);
 }

 if(command==="sequenceAnswer"){
  sequenceAnswer(sender,payload);
 }
}


/* =========================================
   GAME ROUNDS
========================================= */

function beginRound(){

 if(!game.running)return;

 if(game.type==="reaction"){
  beginReaction();
 }

 if(game.type==="target"){
  beginTarget();
 }

 if(game.type==="memory"){
  beginMemory();
 }

 if(game.type==="math"){
  beginMath();
 }

 if(game.type==="color"){
  beginColor();
 }

 if(game.type==="sequence"){
  beginSequence();
}

 gameBroadcast();
 renderGameState();
}


/* =========================================
   REACTION
========================================= */

function beginReaction(){

 game.state={
  phase:"red",
  started:Date.now(),
  greenAt:Date.now()+1000+Math.random()*3500,
  clicks:{}
 };

 gameBroadcast();
 renderGameState();

 setTimeout(()=>{

  if(
   game.running &&
   game.round===game.round &&
   game.state.phase==="red"
  ){

   game.state.phase="green";
   game.state.greenAt=Date.now();

   gameBroadcast();
   renderGameState();

  }

 },game.state.greenAt-Date.now());
}

function reactionClick(id){

 if(game.state.phase==="red"){

  game.state.phase="false";

  game.scores[id].times.push(9999);

  gameBroadcast();
  renderGameState();

  setTimeout(nextRound,1300);

  return;
 }

 if(game.state.phase!=="green")return;

 if(game.state.clicks[id])return;

 const ms=Date.now()-game.state.greenAt;

 game.state.clicks[id]=ms;

 game.scores[id].times.push(ms);
 game.scores[id].score++;

 if(
  Object.keys(game.state.clicks).length>=
  allUsers().length
 ){

  setTimeout(nextRound,1000);

 }else{

  gameBroadcast();
  renderGameState();
 }
}


/* =========================================
   TARGET
========================================= */

function beginTarget(){

 game.state={
  time:20,
  target:{
   x:20+Math.random()*70,
   y:20+Math.random()*65
  },
  clicks:{},
  endsAt:Date.now()+20000
 };

 gameBroadcast();
 renderGameState();

 clearInterval(window.targetTimer);

 window.targetTimer=setInterval(()=>{

  if(!game.running)return;

  game.state.time=
   Math.max(
    0,
    Math.ceil(
     (game.state.endsAt-Date.now())/1000
    )
   );

  if(game.state.time<=0){

   clearInterval(window.targetTimer);
   nextRound();

  }else{

   gameBroadcast();
   renderGameState();

  }

 },300);
}

function targetClick(id){

 if(Date.now()>game.state.endsAt)return;

 game.scores[id].score++;

 game.state.target={
  x:5+Math.random()*85,
  y:5+Math.random()*80
 };

 gameBroadcast();
 renderGameState();
}


/* =========================================
   MEMORY
========================================= */

function beginMemory(){

 const number=
  String(
   Math.floor(
    10000+Math.random()*90000
   )
  );

 game.state={
  number,
  visible:true,
  answered:{},
  started:Date.now()
 };

 gameBroadcast();
 renderGameState();

 setTimeout(()=>{

  if(!game.running)return;

  game.state.visible=false;

  gameBroadcast();
  renderGameState();

 },2500);
}

function memoryAnswer(id,payload){

 if(game.state.answered[id])return;

 game.state.answered[id]=true;

 if(String(payload)===game.state.number){
  game.scores[id].score+=1;
  game.scores[id].times.push(
   Date.now()-game.state.started
  );
 }

 gameBroadcast();
 renderGameState();

 if(
  Object.keys(game.state.answered).length>=
  allUsers().length
 ){

  setTimeout(nextRound,1000);
 }
}


/* =========================================
   MATH
========================================= */

function beginMath(){

 const a=5+Math.floor(Math.random()*25);
 const b=2+Math.floor(Math.random()*20);

 let op="+";
 let answer=a+b;

 if(Math.random()<.5){
  op="-";
  answer=a-b;
 }

 game.state={
  a,b,op,answer,
  answered:{},
  started:Date.now()
 };

 gameBroadcast();
 renderGameState();
}

function mathAnswer(id,payload){

 if(game.state.answered[id])return;

 game.state.answered[id]=true;

 if(Number(payload)===game.state.answer){

  game.scores[id].score++;

  game.scores[id].times.push(
   Date.now()-game.state.started
  );
 }

 gameBroadcast();
 renderGameState();

 if(
  Object.keys(game.state.answered).length>=
  allUsers().length
 ){

  setTimeout(nextRound,1000);
 }
}


/* =========================================
   COLOR
========================================= */

const colors=[
 {
  name:"빨강",
  value:"#e5485d"
 },
 {
  name:"파랑",
  value:"#4d7cff"
 },
 {
  name:"초록",
  value:"#32bd78"
 },
 {
  name:"노랑",
  value:"#e7bd3d"
 }
];

function beginColor(){

 const correct=
  Math.floor(Math.random()*colors.length);

 game.state={
  correct,
  answered:{}
 };

 gameBroadcast();
 renderGameState();
}

function colorAnswer(id,payload){

 if(game.state.answered[id])return;

 game.state.answered[id]=true;

 if(Number(payload)===game.state.correct){

  game.scores[id].score++;

 }

 gameBroadcast();
 renderGameState();

 if(
  Object.keys(game.state.answered).length>=
  allUsers().length
 ){

  setTimeout(nextRound,900);
 }
}


/* =========================================
   SEQUENCE
========================================= */

function beginSequence(){

 const length=
  3+Math.min(
   game.round,
   5
  );

 const seq=[];

 for(let i=0;i<length;i++){
  seq.push(
   Math.floor(Math.random()*9)
  );
 }

 game.state={
  sequence:seq,
  phase:"show",
  answered:{}
 };

 gameBroadcast();
 renderGameState();

 let index=0;

 const timer=setInterval(()=>{

  index++;

  game.state.showIndex=index;

  gameBroadcast();
  renderGameState();

  if(index>seq.length){

   clearInterval(timer);

   game.state.phase="input";
   game.state.showIndex=-1;

   gameBroadcast();
   renderGameState();
  }

 },550);
}

function sequenceAnswer(id,payload){

 if(game.state.answered[id])return;

 const answer=
  Array.isArray(payload)
   ?payload.map(Number)
   :[];

 const good=
  JSON.stringify(answer)===
  JSON.stringify(game.state.sequence);

 game.state.answered[id]=true;

 if(good){
  game.scores[id].score++;
 }

 gameBroadcast();
 renderGameState();

 if(
  Object.keys(game.state.answered).length>=
  allUsers().length
 ){

  setTimeout(nextRound,1000);
 }
}


/* =========================================
   NEXT
========================================= */

function nextRound(){

 if(!game.running)return;

 game.round++;

 if(game.round>3){

  finishGame();

 }else{

  beginRound();

 }
}

function finishGame(){

 game.running=false;

 const ranking=
  Object.entries(game.scores)
   .map(([id,v])=>({
    id,
    ...v
   }))
   .sort((a,b)=>b.score-a.score);

 game.results=ranking;

 gameBroadcast();
 renderGameState();
}


/* =========================================
   RENDER
========================================= */

function renderGameState(){

 if(!game.running && game.results?.length){

  renderResults();
  return;
 }

 if(!game.type){

  showMenu();
  return;
 }

 if(game.type==="reaction")renderReaction();
 if(game.type==="target")renderTarget();
 if(game.type==="memory")renderMemory();
 if(game.type==="math")renderMath();
 if(game.type==="color")renderColor();
 if(game.type==="sequence")renderSequence();
}


function gameTop(title,desc){

 return `
 <div class="playArea">
  <h2>${title}</h2>
  <div class="playInfo">
   ${desc}<br>
   <span class="small">
    ${game.mode==="solo"?"개인전":"2팀전"} · ${game.round}/3 라운드
   </span>
  </div>
 `;

}


/* REACTION */

function renderReaction(){

 const phase=game.state.phase;

 let text="준비하세요";

 if(phase==="red"){
  text="빨간색 — 기다리세요!";
 }

 if(phase==="green"){
  text="🟢 지금!!!";
 }

 if(phase==="false"){
  text="너무 빨랐습니다!";
 }

 $("gameBody").innerHTML=
  gameTop(
   "⚡ 순간 반응",
   "초록색으로 바뀌는 순간 최대한 빨리 누르세요."
  )+
 `
 <button
  class="reactionBoard ${phase==="green"?"green":phase==="false"?"false":""}"
  onclick="gameCommand('reactionClick')"
 >
  ${text}
 </button>

 <div class="small" style="margin-top:15px">
  이번 라운드 결과
  ${Object.entries(game.state.clicks||{})
   .map(([id,ms])=>{
    const s=game.scores[id];
    return `<br>${escapeHTML(s?.name||"플레이어")} : ${ms}ms`;
   }).join("")}
 </div>

 </div>
 `;
}


/* TARGET */

function renderTarget(){

 const s=game.state;

 $("gameBody").innerHTML=
  gameTop(
   "🎯 타겟 클릭",
   `남은 시간: ${s.time}초 · 타겟을 최대한 많이 누르세요.`
  )+
 `
 <div class="gameBoard">

  <button
   class="target"
   style="
    left:${s.target.x}%;
    top:${s.target.y}%;
   "
   onclick="gameCommand('targetClick')"
  ></button>

 </div>

 <div class="small">
  현재 클릭 수:
  ${Object.entries(game.scores)
   .map(([id,v])=>`${escapeHTML(v.name)} ${v.score}회`)
   .join(" · ")}
 </div>

 </div>
 `;
}


/* MEMORY */

function renderMemory(){

 const s=game.state;

 $("gameBody").innerHTML=
  gameTop(
   "🧠 숫자 기억",
   s.visible
    ?"숫자를 기억하세요!"
    :"기억한 숫자를 입력하세요."
  )+
 `
 <div class="numberBox">
  ${s.visible?s.number:"?????"}
 </div>

 ${
  s.visible
   ?""
   :`
    <input
     id="answer"
     class="answerInput"
     maxlength="5"
     inputmode="numeric"
     placeholder="숫자 입력"
    >
    <br>
    <button
     class="actionBtn"
     onclick="
      gameCommand(
       'memoryAnswer',
       document.getElementById('answer').value
      )
     "
    >제출</button>
   `
 }

 </div>
 `;
}


/* MATH */

function renderMath(){

 const s=game.state;

 $("gameBody").innerHTML=
  gameTop(
   "🔢 빠른 계산",
   "정답을 최대한 빨리 입력하세요."
  )+
 `
 <div class="numberBox">
  ${s.a} ${s.op} ${s.b} = ?
 </div>

 <input
  id="answer"
  class="answerInput"
  inputmode="numeric"
  placeholder="정답"
 >

 <br>

 <button
  class="actionBtn"
  onclick="
   gameCommand(
    'mathAnswer',
    document.getElementById('answer').value
   )
  "
 >제출</button>

 </div>
 `;
}


/* COLOR */

function renderColor(){

 const s=game.state;
 const c=colors[s.correct];

 $("gameBody").innerHTML=
  gameTop(
   "🟢 색깔 맞히기",
   `정답 색: ${c.name}`
  )+
 `
 <div
  style="
   margin:30px auto;
   width:180px;height:130px;
   border-radius:20px;
   background:${c.value};
   border:4px solid white
  "
 ></div>

 <div class="colorChoices">

  ${colors.map((x,i)=>`

   <button
    class="colorChoice"
    style="background:${x.value}"
    onclick="gameCommand('colorAnswer',${i})"
   >
    ${x.name}
   </button>

  `).join("")}

 </div>

 </div>
 `;
}


/* SEQUENCE */

function renderSequence(){

 const s=game.state;

 let html="";

 if(s.phase==="show"){

  html=`
   <div class="numberBox" style="font-size:40px">
    ${s.showIndex>=0&&s.showIndex<s.sequence.length
      ?s.sequence[s.showIndex]+1
      :"●"}
   </div>
   <p>순서를 기억하세요!</p>
  `;

 }else{

  html=`
   <p>나온 순서대로 버튼을 누르세요.</p>

   <div class="sequenceGrid">

    ${Array.from({length:9},(_,i)=>`

     <button
      class="seqBtn"
      onclick="sequenceLocal(${i})"
     >
      ${i+1}
     </button>

    `).join("")}

   </div>

   <div id="seqCurrent">
    입력: 
   </div>

   <button
    class="actionBtn"
    onclick="sequenceSubmit()"
   >
    제출
   </button>
  `;
 }

 $("gameBody").innerHTML=
  gameTop(
   "🧩 순서 기억",
   "불이 들어온 버튼의 순서를 기억하세요."
  )+
  html+
  "</div>";
}

let localSequence=[];

function sequenceLocal(n){

 if(localSequence.length>=game.state.sequence.length)return;

 localSequence.push(n);

 renderSequenceLocal();
}

function renderSequenceLocal(){

 const box=$("seqCurrent");

 if(box){
  box.textContent=
   "입력: "+
   localSequence.map(x=>x+1).join(" → ");
 }
}

function sequenceSubmit(){

 const a=[...localSequence];

 localSequence=[];

 gameCommand(
  "sequenceAnswer",
  a
 );
}


/* =========================================
   RESULTS
========================================= */

function renderResults(){

 const rows=
  game.results.map((x,i)=>`
   <div class="resultRow">
    <span>
     ${i===0?"🏆 ":""}${i+1}위
     ${escapeHTML(x.name)}
    </span>
    <b>${x.score}점</b>
   </div>
  `).join("");

 $("gameBody").innerHTML=`

 <div class="playArea">

  <h2>🏆 게임 결과</h2>

  <div class="result">

   <h2>
    ${game.results[0]
      ?escapeHTML(game.results[0].name)+" 승리!"
      :"게임 종료"}
   </h2>

   ${rows}

  </div>

  ${
   host
    ?`
     <button
      class="actionBtn"
      onclick="showMenu()"
     >
      다른 게임 선택
     </button>
    `
    :""
  }

 </div>
 `;
}


/* =========================================
   ESCAPE
========================================= */

function escapeHTML(s){

 return String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =========================================
   INIT
========================================= */

$("name").addEventListener("keydown",e=>{
 if(e.key==="Enter")$("create").click();
});

$("joinCode").addEventListener("keydown",e=>{
 if(e.key==="Enter")$("join").click();
});

</script>
